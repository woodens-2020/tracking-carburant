name: Sauvegarde quotidienne — base Railway

on:
  schedule:
    # 06:00 UTC = 02:00 Haiti (EDT/UTC-4) — heure creuse
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Installer PostgreSQL 18 (client) — version alignee sur le serveur Railway
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Verifier que le secret est present
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Le secret RAILWAY_BACKUP_DATABASE_URL est vide ou absent. Verifiez Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Secret present (longueur : ${#DATABASE_URL} caracteres)."

      - name: Dump de la base Railway
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_BACKUP_DATABASE_URL }}
        run: |
          set -e
          mkdir -p backup
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" --format=custom --no-owner --no-acl \
            --file="backup/railway_${STAMP}.dump"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          ls -la backup/

      - name: Publier la sauvegarde en artefact
        uses: actions/upload-artifact@v4
        with:
          name: railway-db-backup-${{ env.STAMP }}
          path: backup/*.dump
          retention-days: 30
