<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5f59">
<title>Konekta Resepsyon</title>
<link rel="manifest" href="/resepsyon/manifest.webmanifest">
<link rel="icon" href="/resepsyon-app/favicon-64.png">
<link rel="apple-touch-icon" href="/resepsyon-app/icone-apple-180.png">
<style>
:root{--bg:#f3f6f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e3e9f0;--pri:#0f766e;--pri2:#0b5f59;--pri3:#14b8a6;--soft:#e6f6f4;
  --ok:#15803d;--okbg:#dcfce7;--err:#c62828;--errbg:#fdecec;--warn:#b45309;--warnbg:#fff4dc;--blue:#1d4ed8;--bluebg:#e3edff;
  --sh:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* Barre du haut */
.top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--pri2),var(--pri) 60%,#0d9488);color:#fff;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 16px rgba(11,95,89,.25)}
.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800;letter-spacing:.2px}
.top button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:12px;height:40px;min-width:40px;padding:0 12px;font-weight:700;font-size:15px}
.top button.ico{font-size:22px;padding:0}
main{max-width:620px;margin:0 auto;padding:16px 16px 120px}
/* Cartes */
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.muted{color:var(--mut)} .small{font-size:13px}
.sec-t{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;margin:0 0 14px}
.sec-t .n{width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--pri);display:grid;place-items:center;font-size:14px;flex:none}
/* Boutons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:16px 18px;font-weight:800;font-size:17px;
  background:linear-gradient(135deg,var(--pri),#0d9488);color:#fff;box-shadow:0 8px 20px rgba(15,118,110,.28);text-decoration:none}
.btn:active{transform:scale(.985)} .btn:disabled{opacity:.55}
.btn.ghost{background:#fff;color:var(--pri);box-shadow:inset 0 0 0 2px var(--pri)}
.btn.light{background:var(--soft);color:var(--pri);box-shadow:none}
.btn.wa{background:#25D366;box-shadow:0 8px 20px rgba(37,211,102,.3)}
/* Champs : tit → endikasyon → kaz, youn anba lòt */
.fld{padding:14px 0;border-top:1px solid #eef2f6}
.fld:first-of-type{border-top:0;padding-top:4px}
.fld>label,.fld .lbl{display:block;font-weight:800;font-size:15.5px;margin:0;color:var(--ink)}
.fld .req{color:var(--err);margin-left:2px}
.fld .opt{font-weight:600;font-size:12px;color:var(--mut);background:#eef2f6;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.fld .hint{font-size:13.5px;color:var(--mut);margin:3px 0 10px;line-height:1.35}
input,select,textarea{display:block;width:100%;min-height:54px;border:1.5px solid #d5dde6;border-radius:14px;padding:13px 15px;font-size:17px;background:#fff;transition:border-color .15s,box-shadow .15s}
textarea{min-height:90px;resize:vertical}
input::placeholder,textarea::placeholder{color:#a3afbd}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px rgba(15,118,110,.13)}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;padding-right:46px;font-weight:700}
.sel select:invalid,.sel select.vide{color:#8a97a6;font-weight:600}
.sel::after{content:"";position:absolute;right:19px;top:50%;width:10px;height:10px;border-right:2.5px solid var(--pri);border-bottom:2.5px solid var(--pri);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.f-err input,.f-err select,.f-err textarea{border-color:var(--err);background:#fff8f8}
.ferr{color:var(--err);font-size:13.5px;margin-top:7px;display:none;font-weight:700} .f-err .ferr{display:block}
.f-err>label,.f-err .lbl{color:var(--err)}
.tel{display:flex} .tel span{display:grid;place-items:center;border:1.5px solid #d5dde6;border-right:0;border-radius:14px 0 0 14px;padding:0 13px;background:#f1f5f9;font-weight:800;color:#334155}
.tel input{border-radius:0 14px 14px 0}
.unit{position:relative} .unit input{padding-right:64px} .unit b{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:14px;pointer-events:none}
.info{display:flex;gap:10px;align-items:flex-start;background:var(--soft);color:var(--pri2);border-radius:14px;padding:12px 14px;font-size:14px;margin-top:6px}
.info b{display:block}
.stockline{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--pri2);background:var(--soft);border-radius:12px;padding:10px 12px;font-weight:700}
.stockline.neg{color:var(--err);background:var(--errbg)}
.barre-bas{position:sticky;bottom:0;margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 28%)}
/* Produits */
.prods{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.prod{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:left;position:relative}
.prod b{display:block;font-size:16px} .prod span{font-size:12.5px;color:var(--mut)}
.prod .dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:0}
.prod.on{border-color:var(--pri);background:var(--soft);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
.prod.on::after{content:"✓";position:absolute;top:10px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;font-size:13px;font-weight:900;display:grid;place-items:center}
/* Statuts, liste */
.badge{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.s-VALIDE{background:var(--bluebg);color:var(--blue)} .s-AN_WOUT{background:var(--warnbg);color:var(--warn)}
.s-RESEVWA,.s-FEMEN{background:var(--okbg);color:var(--ok)} .s-EKAT,.s-REJTE{background:var(--errbg);color:var(--err)} .s-ANILE{background:#e9eef3;color:#475569}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:0;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.item .av{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--soft)}
.item .tx{flex:1;min-width:0}
.item .l1{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:800}
.item .l2{color:var(--mut);font-size:13.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;font-size:15px;margin:0}
.kv dt{color:var(--mut)} .kv dd{margin:0;font-weight:700;text-align:right;overflow-wrap:anywhere}
.alert{border-radius:16px;padding:13px 15px;margin-bottom:14px;font-weight:600;font-size:15px}
.alert.err{background:var(--errbg);color:var(--err)} .alert.ok{background:var(--okbg);color:var(--ok)} .alert.warn{background:var(--warnbg);color:var(--warn)}
.fab{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:588px;margin:0 auto;z-index:4}
/* Héros */
.hero{background:linear-gradient(135deg,var(--pri2),var(--pri) 55%,#0d9488);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 10px 26px rgba(11,95,89,.25)}
.hero .hi{font-size:13px;opacity:.85} .hero .nm{font-size:20px;font-weight:800;margin-top:2px}
.hero .stats{display:flex;gap:10px;margin-top:14px}
.hero .stats div{flex:1;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px}
.hero .stats b{display:block;font-size:22px} .hero .stats span{font-size:12.5px;opacity:.9}
.big{font-size:32px;font-weight:900;letter-spacing:-.5px}
/* Onglets */
.seg{display:flex;background:#e6ebf1;border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px 8px;font-weight:700;font-size:14px;color:#475569}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 4px rgba(15,23,42,.12)}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fslot{position:relative;aspect-ratio:3/4;border:2px dashed #b9c6d3;border-radius:16px;background:#f8fafc;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;color:var(--pri2);font-weight:800;font-size:14px;text-align:center;padding:10px;overflow:hidden;cursor:pointer}
.fslot .ic{font-size:34px} .fslot small{font-weight:600;color:var(--mut);font-size:12px}
.fslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fslot.ok{border:2px solid var(--pri)} .fslot .re{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(15,23,42,.72);color:#fff;border-radius:10px;padding:7px;font-size:13px}
.fslot .num{position:absolute;top:8px;left:8px;background:var(--pri);color:#fff;border-radius:999px;padding:3px 9px;font-size:12px;z-index:1}
.f-err .fslot:not(.ok){border-color:var(--err);background:var(--errbg)}
.vignettes{display:grid;grid-template-columns:1fr 1fr;gap:10px} .vignettes a{display:block;border-radius:14px;overflow:hidden;aspect-ratio:3/4;background:#e9eef3}
.vignettes img{width:100%;height:100%;object-fit:cover;display:block}
.vide{text-align:center;padding:30px 18px;color:var(--mut)} .vide .e{font-size:40px;margin-bottom:6px}
/* Connexion */
.login{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center}
.logo{text-align:center;margin:10px 0 18px} .logo img{width:92px;height:92px;border-radius:24px;box-shadow:0 12px 30px rgba(15,118,110,.3)}
.logo h2{margin:14px 0 2px;font-size:22px} .logo p{margin:0;color:var(--mut);font-size:14px}
.code{text-transform:uppercase;font-size:24px;letter-spacing:5px;text-align:center;font-weight:800;background:#fff}
.pin{display:flex;justify-content:center;gap:12px;margin:20px 0}
.pin i{width:16px;height:16px;border-radius:50%;background:#d8e0e8;transition:transform .15s,background .15s} .pin i.on{background:var(--pri);transform:scale(1.15)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:320px;margin:0 auto}
.pad button{border:0;background:#fff;border-radius:18px;height:64px;font-size:26px;font-weight:800;box-shadow:var(--sh)}
.pad button:active{background:var(--soft)} .pad button.t{font-size:14px;color:var(--pri);background:transparent;box-shadow:none}
.jl{position:relative;padding:0 0 12px 20px;font-size:14px}
.jl::before{content:"";position:absolute;left:5px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--pri3)}
.jl::after{content:"";position:absolute;left:9px;top:18px;bottom:0;width:1.5px;background:var(--line)}
.jl:last-child::after{display:none}
.spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:r 1s linear infinite;vertical-align:-3px}
.spin.d{border-color:#cbd5e1;border-top-color:var(--pri);width:28px;height:28px}
@keyframes r{to{transform:rotate(360deg)}}
.hide{display:none!important}
</style>
</head>
<body>
<div class="top" id="top">
  <button id="b-back" class="ico hide" onclick="retour()" aria-label="Retounen">‹</button>
  <h1 id="titre">Konekta Resepsyon</h1>
  <button id="b-out" class="hide" onclick="deconnecter()">Soti</button>
</div>
<main id="app"></main>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gal = x => x == null ? '—' : Number(x).toLocaleString('fr-FR', {maximumFractionDigits: 3}) + ' gal';
const dt = s => s ? new Date(s).toLocaleString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '—';
const ST = {VALIDE:'Valide', AN_WOUT:'An wout', RESEVWA:'Resevwa', FEMEN:'Fèmen', EKAT:'Ekat', REJTE:'Rejte', ANILE:'Anile'};
const badge = s => `<span class="badge s-${s}">${ST[s] || s}</span>`;
const COUL = ['#f97316', '#3b82f6', '#22c55e', '#a855f7', '#eab308', '#06b6d4'];
const charge = `<div class="vide"><span class="spin d"></span></div>`;
let moi = null, stations = [], pile = [], form = {}, fotos = [null, null];

async function api(method, path, body){
  const r = await fetch(path, {method, credentials: 'same-origin', headers: body ? {'Content-Type': 'application/json'} : {},
                              body: body ? JSON.stringify(body) : undefined});
  let d = null; try{ d = await r.json(); }catch(_){}
  if(!r.ok){
    const det = d && d.detail;
    const e = new Error(typeof det === 'string' ? det : (det && det.message) || 'Erè ' + r.status);
    e.status = r.status; e.erreurs = det && det.erreurs; throw e;
  }
  return d;
}

function ecran(titre, html, retourPossible){
  $('#titre').textContent = titre;
  $('#b-back').classList.toggle('hide', !retourPossible);
  $('#b-out').classList.toggle('hide', !moi || !!retourPossible);
  $('#app').innerHTML = html;
  window.scrollTo(0, 0);
}
function aller(fn){ pile.push(fn); fn(); }
function retour(){ pile.pop(); (pile[pile.length - 1] || accueil)(); }

/* ── Connexion : kòd → PIN ─────────────────────────────── */
let code = '', pin = '';
function ecranCode(msg){
  pile = [];
  ecran('Konekta Resepsyon', `<div class="login">
    <div class="logo"><img src="/resepsyon-app/icone-192.png" alt=""><h2>Resepsyon kabiran</h2><p>Anrejistre gaz ki rive nan estasyon an</p></div>
    <div class="card">
      ${msg ? `<div class="alert err">${esc(msg)}</div>` : ''}
      <label for="c" style="margin-top:0">Kòd itilizatè <span class="opt">(4 chif + 4 lèt)</span></label>
      <input id="c" class="code" autocomplete="username" autocapitalize="characters" maxlength="8" placeholder="4827KXMT" value="${esc(code)}">
      <div style="height:16px"></div>
      <button class="btn" id="bc" onclick="validerCode()">Kontinye →</button>
    </div></div>`);
  const i = $('#c'); i.focus();
  i.addEventListener('keydown', e => { if(e.key === 'Enter') validerCode(); });
}
async function validerCode(){
  code = $('#c').value.trim().toUpperCase().replace(/\s/g, '');
  if(!/^[0-9]{4}[A-Z]{4}$/.test(code)) return ecranCode('Kòd la dwe gen 4 chif epi 4 lèt (egz: 4827KXMT).');
  $('#bc').disabled = true;
  try{ const r = await api('POST', '/api/resepsyon/identifier', {username: code}); ecranPin(r.prenom); }
  catch(e){ ecranCode(e.message); }
}
function ecranPin(prenom, msg){
  pin = '';
  ecran('Konekta Resepsyon', `<div class="login" style="text-align:center">
    <div class="logo" style="margin-bottom:4px"><img src="/resepsyon-app/icone-192.png" alt="" style="width:70px;height:70px;border-radius:20px">
      <h2>Bonjou ${esc(prenom || '')} 👋</h2><p>Antre PIN ou (6 chif)</p></div>
    ${msg ? `<div class="alert err">${esc(msg)}</div>` : ''}
    <div class="pin" id="pin">${'<i></i>'.repeat(6)}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button onclick="touche('${n}')">${n}</button>`).join('')}
      <button class="t" onclick="ecranCode()">Chanje kòd</button><button onclick="touche('0')">0</button>
      <button class="t" style="font-size:24px" onclick="touche('del')" aria-label="Efase">⌫</button></div>
  </div>`);
  window.__prenom = prenom;
}
async function touche(t){
  if(t === 'del') pin = pin.slice(0, -1); else if(pin.length < 6) pin += t;
  document.querySelectorAll('#pin i').forEach((x, i) => x.classList.toggle('on', i < pin.length));
  if(pin.length === 6){
    try{ moi = await api('POST', '/api/login/resepsyon', {username: code, pin}); await demarrer(); }
    catch(e){ ecranPin(window.__prenom, e.message); }
  }
}
async function deconnecter(){
  try{ await api('POST', '/api/logout'); }catch(_){}
  moi = null; code = ''; ecranCode();
}

/* ── Accueil ───────────────────────────────────────────── */
async function demarrer(){
  try{ moi = await api('GET', '/api/resepsyon/me'); }catch(e){ moi = null; return ecranCode(); }
  pile = []; accueil();
}
async function accueil(){
  pile = [accueil];
  ecran('Livrezon kabiran', charge);
  let L = [];
  try{ L = (await api('GET', '/api/resepsyon/livrezon')).livrezons; }
  catch(e){ if(e.status === 401) return ecranCode(); return ecran('Livrezon kabiran', `<div class="alert err">${esc(e.message)}</div>`); }
  const jodi = new Date().toDateString();
  const bon = L.filter(l => l.statut !== 'ANILE' && l.statut !== 'REJTE');
  const nJodi = bon.filter(l => new Date(l.resevwa_at || l.date_livrezon).toDateString() === jodi).length;
  ecran('Livrezon kabiran', `
    <div class="hero">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div><div class="hi">Konekte kòm</div><div class="nm">${esc(moi.nom_complet)}</div><div class="hi">${esc(moi.username)}</div></div>
        <button onclick="accueil()" aria-label="Rafrechi" style="border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:12px;width:42px;height:42px;font-size:18px">↻</button>
      </div>
      <div class="stats"><div><b>${nJodi}</b><span>kamyon jodi a</span></div><div><b>${bon.length}</b><span>kamyon resevwa</span></div></div>
    </div>
    <div class="sec-t" style="margin:4px 2px 10px">✅ Gaz resevwa</div>
    ${L.length ? L.map(item).join('') : `<div class="card vide"><div class="e">🚛</div>Poko gen livrezon resevwa.<br>Peze « Nouvo livrezon » lè yon kamyon gaz rive.</div>`}
    <div style="height:70px"></div>
    <button class="btn fab" onclick="aller(nouveau)">＋ Nouvo livrezon</button>`);
}
function item(l){
  const ic = {VALIDE: '🚚', AN_WOUT: '🚚', RESEVWA: '✅', FEMEN: '✅', EKAT: '⚠️', REJTE: '⛔', ANILE: '⛔'}[l.statut] || '⛽';
  return `<button class="item" onclick="aller(()=>detail(${l.id}))">
    <div class="av">${ic}</div>
    <div class="tx"><div class="l1"><span>${esc(l.produit_nom)} · ${gal(l.kantite_resevwa ?? l.kantite_voye)}</span>${badge(l.statut)}</div>
    <div class="l2">📍 ${esc(l.station_nom)} · ${dt(l.resevwa_at || l.date_livrezon)}</div>
    <div class="l2">🚛 ${l.plak_kamyon ? esc(l.plak_kamyon) + ' · ' : ''}${esc(l.konpayi)}</div></div></button>`;
}

/* ── Formulaire de livraison ───────────────────────────── */
async function nouveau(){
  ecran('Nouvo livrezon', charge, true);
  try{ stations = (await api('GET', '/api/resepsyon/stations')).stations; }
  catch(e){ return ecran('Nouvo livrezon', `<div class="alert err">${esc(e.message)}</div>`, true); }
  form = {station_id: stations.length === 1 ? stations[0].id : null}; fotos = [null, null];
  dessinerForm();
}
/* Chan : tit → endikasyon → kaz (youn anba lòt) */
function champ(id, titre, hint, attrs = '', opt = false, unite = ''){
  const inp = `<input id="i-${id}" ${attrs} value="${esc(form[id] ?? '')}" oninput="form['${id}']=this.value;nettoyer('${id}')">`;
  return `<div class="fld" id="f-${id}"><label for="i-${id}">${titre}${opt ? '<span class="opt">opsyonèl</span>' : '<span class="req">*</span>'}</label>
    <div class="hint">${hint}</div>${unite ? `<div class="unit">${inp}<b>${unite}</b></div>` : inp}<div class="ferr"></div></div>`;
}
function optsProduits(st){
  if(!st) return '<option value="" selected disabled>Chwazi estasyon an anvan</option>';
  if(!st.produits.length) return '<option value="" selected disabled>Pa gen kabiran nan estasyon sa a</option>';
  return `<option value="" ${form.produit_id == null ? 'selected' : ''} disabled>— Chwazi tip kabiran an —</option>` +
    st.produits.map(p => `<option value="${p.id}" ${p.id === form.produit_id ? 'selected' : ''}>${esc(p.nom)}</option>`).join('');
}
function ligneStock(){
  const st = stations.find(s => s.id === form.station_id), p = st && st.produits.find(x => x.id === form.produit_id);
  const z = $('#stock-info'); if(!z) return;

function slotFoto(i){
  const f = fotos[i];

/* Foto a redui (1600 px, JPEG) pou l voye vit menm sou rezo telefòn */
function comprimer(file){
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.78));
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error('Foto a pa ka li : pran l ankò.')); };
    img.src = url;
  });
}

  const file = inp.files && inp.files[0]; if(!file) return;
  const i = slotCam, z = document.getElementById('slot-' + i);

  try{ fotos[i] = await comprimer(file); }catch(e){ alert(e.message); }
  z.outerHTML = slotFoto(i);

}

  const b = $('#b-rec'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Ap konfime…';
  const num = v => v === '' ? null : Number(v);
  try{
    const l = await api('POST', `/api/resepsyon/livrezon/${id}/resevwa`,
      {kantite_resevwa: q, jog_avan: num($('#r-a').value), jog_apre: num($('#r-p').value), komante: $('#r-c').value || null});
    await detail(id, 'Resepsyon anrejistre — stock ' + l.station_nom + ' mete ajou. Fèy PDF la pare.');
    window.open(`/api/resepsyon/livrezon/${id}/pdf`, '_blank');
  }catch(e){ b.disabled = false; b.textContent = '✓ Konfime resepsyon'; alert(e.message); }
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('/resepsyon-sw.js', {scope: '/resepsyon'}).catch(() => {});
demarrer();
</script>
