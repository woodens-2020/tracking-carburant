<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Konekta Resepsyon</title>
<link rel="manifest" href="/resepsyon/manifest.webmanifest">
<link rel="icon" href="/resepsyon-app/favicon-64.png">
<link rel="apple-touch-icon" href="/resepsyon-app/icone-apple-180.png">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#dbe3ee;--pri:#0f766e;--pri2:#115e59;--ok:#15803d;--okbg:#dcfce7;
  --err:#b91c1c;--errbg:#fee2e2;--warn:#b45309;--warnbg:#fef3c7;--blue:#1d4ed8;--bluebg:#dbeafe}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700}
main{max-width:640px;margin:0 auto;padding:16px 16px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.muted{color:var(--mut)} .small{font-size:13px}
h2{font-size:17px;margin:4px 0 12px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;font-weight:800;font-size:17px;background:var(--pri);color:#fff}
.btn:disabled{opacity:.55} .btn.sec{background:#e2e8f0;color:var(--ink)} .btn.out{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.row{display:flex;gap:10px} .row>*{flex:1;min-width:0}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
label .opt{font-weight:400;color:var(--mut)}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
.f-err input,.f-err select,.f-err textarea{border-color:var(--err);background:#fff8f8}
.ferr{color:var(--err);font-size:13px;margin-top:4px;display:none} .f-err .ferr{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;min-width:0}
.chip.on{border-color:var(--pri);background:#ecfdf5;box-shadow:0 0 0 2px rgba(15,118,110,.2)}
.chip b{display:block} .chip span{font-size:12px;color:var(--mut)}
.tel{display:flex} .tel span{border:1.5px solid var(--line);border-right:0;border-radius:12px 0 0 12px;padding:12px 10px;background:#f1f5f9;font-weight:700}
.tel input{border-radius:0 12px 12px 0}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800}
.s-VALIDE{background:var(--bluebg);color:var(--blue)} .s-AN_WOUT{background:var(--warnbg);color:var(--warn)}
.s-RESEVWA,.s-FEMEN{background:var(--okbg);color:var(--ok)} .s-EKAT,.s-REJTE{background:var(--errbg);color:var(--err)} .s-ANILE{background:#e2e8f0;color:#475569}
.item{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.item .l1{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:800}
.item .l2{color:var(--mut);font-size:14px;margin-top:3px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--mut)} .kv dd{margin:0;font-weight:600;text-align:right;overflow-wrap:anywhere}
.alert{border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:600}
.alert.err{background:var(--errbg);color:var(--err)} .alert.ok{background:var(--okbg);color:var(--ok)} .alert.warn{background:var(--warnbg);color:var(--warn)}
.fab{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:608px;margin:0 auto;box-shadow:0 10px 25px rgba(15,118,110,.35)}
.pin{display:flex;justify-content:center;gap:10px;margin:18px 0}
.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri)} .pin i.on{background:var(--pri)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:0 auto}
.pad button{border:0;background:#fff;border-radius:16px;padding:18px 0;font-size:24px;font-weight:800;box-shadow:0 1px 0 var(--line)}
.logo{text-align:center;margin:30px 0 10px} .logo img{width:84px;height:84px;border-radius:20px}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;border-radius:999px;padding:8px 14px;background:#e2e8f0;font-weight:700;white-space:nowrap}
.tabs button.on{background:var(--pri);color:#fff}
.big{font-size:28px;font-weight:900}
.jl{border-left:3px solid var(--line);padding:2px 0 8px 12px;font-size:14px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:r 1s linear infinite;vertical-align:-3px}
@keyframes r{to{transform:rotate(360deg)}}
.hide{display:none!important}
</style>
</head>
<body>
<div class="top" id="top">
  <button id="b-back" class="hide" onclick="retour()">‹</button>
  <h1 id="titre">Konekta Resepsyon</h1>
  <button id="b-out" class="hide" onclick="deconnecter()">Soti</button>
</div>
<main id="app"></main>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gal = x => x == null ? '—' : Number(x).toLocaleString('fr-FR', {maximumFractionDigits: 3}) + ' gal';
const dt = s => s ? new Date(s).toLocaleString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '—';
const ST = {VALIDE:'Valide', AN_WOUT:'An wout', RESEVWA:'Resevwa', FEMEN:'Fèmen', EKAT:'Ekat', REJTE:'Rejte', ANILE:'Anile'};
const badge = s => `<span class="badge s-${s}">${ST[s] || s}</span>`;
let moi = null, stations = [], pile = [], form = {}, onglet = 'tann';

async function api(method, path, body){
  const r = await fetch(path, {method, credentials: 'same-origin', headers: body ? {'Content-Type': 'application/json'} : {},
                              body: body ? JSON.stringify(body) : undefined});
  let d = null; try{ d = await r.json(); }catch(_){}
  if(!r.ok){
    const det = d && d.detail;
    const e = new Error(typeof det === 'string' ? det : (det && det.message) || 'Erè ' + r.status);
    e.status = r.status; e.erreurs = det && det.erreurs; throw e;
  }
  return d;
}

function ecran(titre, html, retourPossible){
  $('#titre').textContent = titre;
  $('#b-back').classList.toggle('hide', !retourPossible);
  $('#b-out').classList.toggle('hide', !moi);
  $('#app').innerHTML = html;
  window.scrollTo(0, 0);
}
function aller(fn){ pile.push(fn); fn(); }
function retour(){ pile.pop(); (pile[pile.length - 1] || accueil)(); }

/* ── Connexion : kòd → PIN ─────────────────────────────── */
let code = '', pin = '';
function ecranCode(msg){
  pile = [];
  ecran('Konekta Resepsyon', `
    <div class="logo"><img src="/resepsyon-app/icone-192.png" alt=""></div>
    <div class="card">
      <h2>Konekte</h2>
      ${msg ? `<div class="alert err">${esc(msg)}</div>` : ''}
      <label for="c">Kòd itilizatè <span class="opt">(4 chif + 4 lèt)</span></label>
      <input id="c" autocomplete="username" autocapitalize="characters" maxlength="8" placeholder="egz: 4827KXMT" value="${esc(code)}"
             style="text-transform:uppercase;font-size:22px;letter-spacing:3px;text-align:center">
      <div style="height:14px"></div>
      <button class="btn" id="bc" onclick="validerCode()">Kontinye</button>
    </div>
    <p class="small muted" style="text-align:center">Livrezon kabiran · Réception du carburant</p>`);
  const i = $('#c'); i.focus();
  i.addEventListener('keydown', e => { if(e.key === 'Enter') validerCode(); });
}
async function validerCode(){
  code = $('#c').value.trim().toUpperCase().replace(/\s/g, '');
  if(!/^[0-9]{4}[A-Z]{4}$/.test(code)) return ecranCode('Kòd la dwe gen 4 chif epi 4 lèt (egz: 4827KXMT).');
  $('#bc').disabled = true;
  try{ const r = await api('POST', '/api/resepsyon/identifier', {username: code}); ecranPin(r.prenom); }
  catch(e){ ecranCode(e.message); }
}
function ecranPin(prenom, msg){
  pin = '';
  ecran('Konekta Resepsyon', `
    <div class="card" style="text-align:center">
      <h2>Bonjou ${esc(prenom || '')} 👋</h2>
      <div class="muted">Antre PIN ou (6 chif)</div>
      ${msg ? `<div class="alert err" style="margin-top:12px">${esc(msg)}</div>` : ''}
      <div class="pin" id="pin">${'<i></i>'.repeat(6)}</div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button onclick="touche('${n}')">${n}</button>`).join('')}
        <button onclick="ecranCode()" style="font-size:15px">Chanje kòd</button><button onclick="touche('0')">0</button>
        <button onclick="touche('del')">⌫</button></div>
    </div>`);
  window.__prenom = prenom;
}
async function touche(t){
  if(t === 'del') pin = pin.slice(0, -1); else if(pin.length < 6) pin += t;
  document.querySelectorAll('#pin i').forEach((x, i) => x.classList.toggle('on', i < pin.length));
  if(pin.length === 6){
    try{ moi = await api('POST', '/api/login/resepsyon', {username: code, pin}); await demarrer(); }
    catch(e){ ecranPin(window.__prenom, e.message); }
  }
}
async function deconnecter(){
  try{ await api('POST', '/api/logout'); }catch(_){}
  moi = null; code = ''; ecranCode();
}

/* ── Accueil ───────────────────────────────────────────── */
async function demarrer(){
  try{ moi = await api('GET', '/api/resepsyon/me'); }catch(e){ moi = null; return ecranCode(); }
  pile = []; accueil();
}
async function accueil(){
  pile = [accueil];
  ecran('Livrezon kabiran', `<div class="muted" style="text-align:center;padding:30px"><span class="spin" style="border-color:#cbd5e1;border-top-color:var(--pri)"></span></div>`);
  let L = [];
  try{ L = (await api('GET', '/api/resepsyon/livrezon')).livrezons; }
  catch(e){ if(e.status === 401) return ecranCode(); return ecran('Livrezon kabiran', `<div class="alert err">${esc(e.message)}</div>`); }
  const tann = L.filter(l => l.statut === 'VALIDE' || l.statut === 'AN_WOUT');
  const fini = L.filter(l => !(l.statut === 'VALIDE' || l.statut === 'AN_WOUT'));
  const liste = onglet === 'tann' ? tann : fini;
  ecran('Livrezon kabiran', `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <div><div class="muted small">Konekte</div><b>${esc(moi.nom_complet)}</b> <span class="muted small">${esc(moi.username)}</span></div>
      <button class="btn sec" style="width:auto;padding:10px 14px;font-size:14px" onclick="accueil()">↻</button>
    </div>
    <div class="tabs">
      <button class="${onglet === 'tann' ? 'on' : ''}" onclick="onglet='tann';accueil()">🚚 K ap tann (${tann.length})</button>
      <button class="${onglet === 'fini' ? 'on' : ''}" onclick="onglet='fini';accueil()">✅ Resevwa / lòt (${fini.length})</button>
    </div>
    ${liste.length ? liste.map(item).join('') : `<div class="card muted" style="text-align:center">${onglet === 'tann'
      ? 'Pa gen livrezon k ap tann. Peze « + Nouvo livrezon » lè kamyon an rive.' : 'Poko gen livrezon resevwa.'}</div>`}
    <button class="btn fab" onclick="aller(nouveau)">+ Nouvo livrezon</button>`);
}
function item(l){
  return `<button class="item" onclick="aller(()=>detail(${l.id}))">
    <div class="l1"><span>${esc(l.produit_nom)} · ${gal(l.kantite_voye)}</span>${badge(l.statut)}</div>
    <div class="l2">📍 ${esc(l.station_nom)} · ${dt(l.date_livrezon)}</div>
    <div class="l2">🚛 ${esc(l.plak_kamyon)} · ${esc(l.konpayi)} · Bon ${esc(l.no_bon)}</div></button>`;
}

/* ── Formulaire de livraison ───────────────────────────── */
function maintenantLocal(){
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}
async function nouveau(){
  ecran('Nouvo livrezon', `<div class="muted" style="text-align:center;padding:30px">Chajman estasyon yo…</div>`, true);
  try{ stations = (await api('GET', '/api/resepsyon/stations')).stations; }
  catch(e){ return ecran('Nouvo livrezon', `<div class="alert err">${esc(e.message)}</div>`, true); }
  form = {date_livrezon: maintenantLocal(), station_id: stations.length === 1 ? stations[0].id : null};
  dessinerForm();
}
function champ(id, label, attrs = '', opt = false){
  return `<div id="f-${id}"><label for="i-${id}">${label}${opt ? ' <span class="opt">(opsyonèl)</span>' : ''}</label>
    <input id="i-${id}" ${attrs} value="${esc(form[id] ?? '')}" oninput="form['${id}']=this.value;nettoyer('${id}')"><div class="ferr"></div></div>`;
}
function dessinerForm(erreurs){
  const st = stations.find(s => s.id === form.station_id);
  ecran('Nouvo livrezon', `
    ${erreurs && erreurs.length ? `<div class="alert err">Gen ${erreurs.length} erè : korije chan ki an wouj yo.</div>` : ''}
    <div class="card">
      <h2>1. Ki estasyon k ap resevwa gaz la?</h2>
      <div id="f-station_id"><div class="chips">${stations.map(s => `<button type="button" class="chip ${s.id === form.station_id ? 'on' : ''}"
         onclick="form.station_id=${s.id};form.produit_id=null;dessinerForm()"><b>${esc(s.nom)}</b><span>${esc(s.adresse || '')}</span></button>`).join('')}</div>
        <div class="ferr"></div></div>
    </div>
    ${st ? `<div class="card">
      <h2>2. Tip kabiran</h2>
      <div id="f-produit_id"><div class="chips">${st.produits.map(p => `<button type="button" class="chip ${p.id === form.produit_id ? 'on' : ''}"
         onclick="form.produit_id=${p.id};dessinerForm()"><b>${esc(p.nom)}</b><span>Stock: ${p.stock == null ? '—' : gal(p.stock)}</span></button>`).join('')
         || '<div class="muted">Estasyon sa a pa gen kabiran anrejistre.</div>'}</div><div class="ferr"></div></div>
    </div>` : ''}
    <div class="card">
      <h2>3. Enfòmasyon livrezon</h2>
      ${champ('date_livrezon', 'Dat & lè', 'type="datetime-local"')}
      <div class="row">${champ('no_bon', 'No bon livrezon', 'autocapitalize="characters"')}${champ('no_kontre_plen', 'No kontre-plen', '', true)}</div>
      <div class="row">${champ('kantite_voye', 'Kantite (galon)', 'type="number" inputmode="decimal" step="0.001" min="0"')}${champ('pri_galon', 'Pri / galon (G)', 'type="number" inputmode="decimal" step="0.01" min="0"', true)}</div>
      ${champ('konpayi', 'Konpayi')}
    </div>
    <div class="card">
      <h2>4. Kamyon & chofè</h2>
      ${champ('chofe', 'Chofè', 'autocomplete="name"')}
      <div id="f-telefon_chofe"><label for="i-telefon_chofe">Telefòn chofè</label>
        <div class="tel"><span>+509</span><input id="i-telefon_chofe" type="tel" inputmode="numeric" maxlength="11" placeholder="3456 7890"
          value="${esc(form.telefon_chofe ?? '')}" oninput="form.telefon_chofe=this.value;nettoyer('telefon_chofe')"></div><div class="ferr"></div></div>
      ${champ('plak_kamyon', 'Plak kamyon', 'autocapitalize="characters"')}
      <div id="f-komante"><label for="i-komante">Kòmantè <span class="opt">(opsyonèl)</span></label>
        <textarea id="i-komante" rows="3" oninput="form.komante=this.value">${esc(form.komante ?? '')}</textarea></div>
    </div>
    <button class="btn" id="b-env" onclick="envoyer()">Anrejistre livrezon an</button>`, true);
  (erreurs || []).forEach(e => marquer(e.chan, e.message));
}
function marquer(chan, msg){
  const z = document.getElementById('f-' + chan); if(!z) return;
  z.classList.add('f-err'); const m = z.querySelector('.ferr'); if(m) m.textContent = msg;
}
function nettoyer(chan){ const z = document.getElementById('f-' + chan); if(z) z.classList.remove('f-err'); }
function verifierLocal(){
  const e = [];
  if(form.station_id == null) e.push({chan: 'station_id', message: 'Chwazi estasyon an.'});
  if(form.station_id != null && form.produit_id == null) e.push({chan: 'produit_id', message: 'Chwazi tip kabiran an.'});
  for(const [c, l] of [['no_bon', 'No bon livrezon'], ['konpayi', 'Konpayi'], ['chofe', 'Chofè'], ['plak_kamyon', 'Plak kamyon'], ['date_livrezon', 'Dat & lè']])
    if(!String(form[c] || '').trim()) e.push({chan: c, message: l + ' obligatwa.'});
  const q = Number(form.kantite_voye);
  if(!(q > 0)) e.push({chan: 'kantite_voye', message: 'Kantite a dwe plis pase 0.'});
  const t = String(form.telefon_chofe || '').replace(/\D/g, '');
  if(!/^[0-9]{8}$/.test(t)) e.push({chan: 'telefon_chofe', message: '8 chif apre +509 (egz: 3456 7890).'});
  return e;
}
async function envoyer(){
  const e = verifierLocal();
  if(e.length) return dessinerForm(e);
  const b = $('#b-env'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Ap anrejistre…';
  const corps = {station_id: form.station_id, produit_id: form.produit_id, date_livrezon: form.date_livrezon,
    no_bon: form.no_bon, no_kontre_plen: form.no_kontre_plen || null, kantite_voye: Number(form.kantite_voye),
    pri_galon: form.pri_galon === '' || form.pri_galon == null ? null : Number(form.pri_galon),
    chofe: form.chofe, telefon_chofe: '+509' + String(form.telefon_chofe).replace(/\D/g, ''),
    plak_kamyon: form.plak_kamyon, konpayi: form.konpayi, komante: form.komante || null};
  try{
    const l = await api('POST', '/api/resepsyon/livrezon', corps);
    pile.pop(); onglet = 'tann';
    aller(() => detail(l.id, 'Livrezon ' + l.numero + ' anrejistre. Lè kamyon an fin vide, konfime resepsyon an anba a.'));
  }catch(err){
    if(err.erreurs) return dessinerForm(err.erreurs);
    b.disabled = false; b.textContent = 'Anrejistre livrezon an';
    alert(err.message);
  }
}

/* ── Détail, réception, PDF ────────────────────────────── */
async function detail(id, msg){
  let l;
  try{ l = await api('GET', '/api/resepsyon/livrezon/' + id); }
  catch(e){ return ecran('Livrezon', `<div class="alert err">${esc(e.message)}</div>`, true); }
  const kv = (k, v) => `<dt>${k}</dt><dd>${v}</dd>`;
  const attend = l.statut === 'VALIDE' || l.statut === 'AN_WOUT';
  ecran(l.numero, `
    ${msg ? `<div class="alert ok">${esc(msg)}</div>` : ''}
    ${l.statut === 'EKAT' ? `<div class="alert err">⚠ Alèt ekat : voye ${gal(l.kantite_voye)}, resevwa ${gal(l.kantite_resevwa)} — ekat ${gal(l.ekat)} (tolerans ${gal(l.tolerans)}). Direksyon an resevwa notifikasyon an.</div>` : ''}
    ${l.statut === 'FEMEN' ? `<div class="alert ok">✓ Livrezon fèmen. Stock ${esc(l.station_nom)} mete ajou (+${gal(l.kantite_resevwa)}).</div>` : ''}
    ${l.statut === 'REJTE' || l.statut === 'ANILE' ? `<div class="alert err">${ST[l.statut]} : ${esc(l.motif || '')}</div>` : ''}
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0">${esc(l.produit_nom)}</h2>${badge(l.statut)}</div>
      <div class="big">${gal(l.kantite_voye)}</div>
      <dl class="kv" style="margin-top:12px">
        ${kv('Estasyon', esc(l.station_nom))}${kv('Dat & lè', dt(l.date_livrezon))}${kv('No bon', esc(l.no_bon))}
        ${kv('Kontre-plen', esc(l.no_kontre_plen || '—'))}${kv('Konpayi', esc(l.konpayi))}
        ${kv('Pri / galon', l.pri_galon == null ? '—' : Number(l.pri_galon).toLocaleString('fr-FR') + ' G')}
        ${kv('Chofè', esc(l.chofe))}${kv('Telefòn', `<a href="tel:${esc(l.telefon_chofe)}">${esc(l.telefon_chofe)}</a>`)}
        ${kv('Plak', esc(l.plak_kamyon))}${l.komante ? kv('Kòmantè', esc(l.komante)) : ''}
        ${l.kantite_resevwa != null ? kv('Resevwa', gal(l.kantite_resevwa)) + kv('Jòj avan / apre', gal(l.jog_avan) + ' / ' + gal(l.jog_apre)) + kv('Ekat', gal(l.ekat)) + kv('Resevwa pa', esc(l.resevwa_par || '—') + ' · ' + dt(l.resevwa_at)) : ''}
      </dl>
    </div>
    ${attend ? `<div class="card" id="rec">
      <h2>🛢 Konfime resepsyon an</h2>
      <div class="muted small">Lè kamyon an fin vide nan tank lan. Stock ${esc(l.station_nom)} ap mete ajou otomatikman.</div>
      <div id="f-kantite_resevwa"><label for="r-q">Kantite resevwa (galon)</label>
        <input id="r-q" type="number" inputmode="decimal" step="0.001" min="0" value="${l.kantite_voye}"><div class="ferr"></div></div>
      <div class="row">
        <div><label for="r-a">Jòj tank avan <span class="opt">(gal)</span></label><input id="r-a" type="number" inputmode="decimal" step="0.001" min="0" oninput="calcJog()"></div>
        <div><label for="r-p">Jòj tank apre <span class="opt">(gal)</span></label><input id="r-p" type="number" inputmode="decimal" step="0.001" min="0" oninput="calcJog()"></div>
      </div>
      <div id="jog-info" class="small muted" style="margin-top:6px"></div>
      <label for="r-c">Kòmantè <span class="opt">(opsyonèl)</span></label><textarea id="r-c" rows="2"></textarea>
      <div style="height:12px"></div>
      <button class="btn" id="b-rec" onclick="recevoir(${l.id}, ${l.kantite_voye}, ${l.tolerans})">✓ Konfime resepsyon</button>
    </div>` : ''}
    <a class="btn out" style="text-align:center;text-decoration:none;margin-bottom:14px" href="/api/resepsyon/livrezon/${l.id}/pdf" target="_blank" rel="noopener">📄 Fèy PDF livrezon an</a>
    <div class="card"><h2>Jounal</h2>${(l.jounal || []).map(j => `<div class="jl"><b>${esc(j.aksyon)}</b> ${j.nouvo_statut ? badge(j.nouvo_statut) : ''}
      <div class="muted">${dt(j.at)} · ${esc(j.itilizate || '—')}</div></div>`).join('') || '<div class="muted">—</div>'}</div>`, true);
}
function calcJog(){
  const a = Number($('#r-a').value), p = Number($('#r-p').value), z = $('#jog-info');
  if($('#r-a').value && $('#r-p').value){
    if(p < a){ z.textContent = 'Jòj apre a dwe pi wo pase jòj avan an.'; z.style.color = 'var(--err)'; return; }
    z.style.color = ''; z.innerHTML = `Diferans jòj : <b>${gal(p - a)}</b> <a href="#" onclick="$('#r-q').value=${(p - a).toFixed(3)};return false">→ itilize l kòm kantite resevwa</a>`;
  } else z.textContent = '';
}
async function recevoir(id, voye, tol){
  const q = Number($('#r-q').value);
  if(!(q > 0)) return marquer('kantite_resevwa', 'Kantite resevwa a dwe plis pase 0.');
  const ekat = voye - q;
  if(Math.abs(ekat) > tol && !confirm(`Ekat ${gal(ekat)} (plis pase tolerans ${gal(tol)}). Direksyon an ap resevwa yon alèt. Konfime?`)) return;
  const b = $('#b-rec'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Ap konfime…';
  const num = v => v === '' ? null : Number(v);
  try{
    const l = await api('POST', `/api/resepsyon/livrezon/${id}/resevwa`,
      {kantite_resevwa: q, jog_avan: num($('#r-a').value), jog_apre: num($('#r-p').value), komante: $('#r-c').value || null});
    onglet = 'fini';
    await detail(id, 'Resepsyon anrejistre — stock ' + l.station_nom + ' mete ajou. Fèy PDF la pare.');
    window.open(`/api/resepsyon/livrezon/${id}/pdf`, '_blank');
  }catch(e){ b.disabled = false; b.textContent = '✓ Konfime resepsyon'; alert(e.message); }
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('/resepsyon-sw.js', {scope: '/resepsyon'}).catch(() => {});
demarrer();
</script>
</body>
</html>
