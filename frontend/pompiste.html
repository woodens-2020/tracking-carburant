<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Espace pompiste</title>
<style>
:root{
  --bg:#eef2f7; --panel:#fff; --text:#0f172a; --muted:#64748b; --border:#d7dee8;
  --accent:#ea580c; --accent-2:#c2410c; --accent-soft:#fff1e8; --ok:#16a34a; --ok-soft:#e7f6ec;
  --err:#dc2626; --err-soft:#fdecec; --warn:#b45309; --warn-soft:#fff5dc;
  --gaz:#16a34a; --gaz-soft:#e7f6ec; --die:#2563eb; --die-soft:#e8effd;
  --touche:#f6f8fb; --ombre:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.06);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1220; --panel:#121b2f; --text:#e5e9f2; --muted:#94a3b8; --border:#26334f;
    --accent:#fb923c; --accent-2:#f97316; --accent-soft:#2a1c10; --ok:#4ade80; --ok-soft:#0f2619;
    --err:#f87171; --err-soft:#2c1414; --warn:#fbbf24; --warn-soft:#2a2210;
    --gaz:#4ade80; --gaz-soft:#0f2619; --die:#60a5fa; --die-soft:#101d33; --touche:#18233b;
    --ombre:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
.env{background:#b91c1c;color:#fff;text-align:center;font-size:13px;font-weight:700;letter-spacing:.08em;padding:5px}
header{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--panel);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
header .marque{font-weight:900;font-size:20px;letter-spacing:.03em}
header .qui{margin-left:auto;text-align:right;line-height:1.2}
header .qui b{display:block;font-size:17px}
header .qui span{font-size:14px;color:var(--muted);font-family:var(--mono)}
main{max-width:1060px;margin:0 auto;padding:22px 24px 150px}
h1{font-size:32px;line-height:1.15;margin:4px 0 6px;letter-spacing:-.01em}
h2{font-size:20px;margin:26px 0 10px}
p.sub{color:var(--muted);margin:0 0 20px;font-size:18px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:var(--ombre)}
label{display:block;font-size:15px;font-weight:700;color:var(--muted);margin:12px 0 6px}
input,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);
  border:2px solid var(--border);border-radius:14px;padding:14px 16px}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
.btn{font:inherit;font-weight:800;border:0;border-radius:16px;padding:16px 22px;cursor:pointer;
  background:var(--accent);color:#fff;width:100%;min-height:64px;font-size:20px}
.btn:active{background:var(--accent-2)}
.btn:disabled{opacity:.35;cursor:default}
.btn.sec{background:var(--panel);color:var(--text);border:2px solid var(--border)}
.btn.petit{width:auto;min-height:0;padding:10px 18px;font-size:16px;border-radius:12px}
.lien{background:none;border:0;color:var(--muted);font:inherit;font-size:17px;text-decoration:underline;
  cursor:pointer;padding:14px 0;display:block;margin:8px auto 0}

/* Fil */
.fil{display:flex;align-items:center;gap:12px;margin:0 0 16px;min-height:52px}
.fil .retour{font:inherit;font-weight:800;font-size:17px;background:var(--panel);border:2px solid var(--border);
  color:var(--text);border-radius:14px;padding:11px 20px;cursor:pointer}
.fil .pas{margin-left:auto;font-size:15px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.resume{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.resume span{font-size:15px;font-weight:800;background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:6px 14px}

/* Gros boutons de choix */
.choix{display:grid;gap:16px}
@media (min-width:700px){ .choix.deux{grid-template-columns:1fr 1fr} .choix.trois{grid-template-columns:repeat(2,1fr)} }
@media (min-width:980px){ .choix.trois{grid-template-columns:repeat(3,1fr)} }
.gros{display:flex;align-items:center;gap:18px;width:100%;min-height:110px;padding:20px 22px;cursor:pointer;
  font:inherit;font-size:26px;font-weight:900;text-align:left;color:var(--text);
  background:var(--panel);border:3px solid var(--border);border-radius:24px;box-shadow:var(--ombre)}
.gros:active{transform:scale(.985)}
.gros .ico{flex:none;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:34px;background:var(--bg)}
.gros small{display:block;font-size:16px;font-weight:600;color:var(--muted);margin-top:3px}
.gros.gaz .ico{background:var(--gaz-soft);color:var(--gaz)}
.gros.die .ico{background:var(--die-soft);color:var(--die)}
.gros.on{border-color:var(--accent);background:var(--accent-soft)}
.gros.on .coche{background:var(--accent);border-color:var(--accent);color:#fff}
.gros .coche{margin-left:auto;flex:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--border);
  display:grid;place-items:center;font-size:24px;color:transparent}
.gros:disabled{opacity:.45;cursor:default}
.gros.erreur{border-color:var(--err)}
.gros.grand{min-height:150px;font-size:32px}
.gros.grand .ico{width:80px;height:80px;font-size:44px}

/* Deux colonnes : informations | clavier */
.deux-col{display:grid;gap:20px}
@media (min-width:820px){ .deux-col{grid-template-columns:1fr 380px;align-items:start} .deux-col .cote{position:sticky;top:96px} }
.pompe-titre{font-size:38px;font-weight:900;margin:0}
.champ{background:var(--panel);border:3px solid var(--border);border-radius:20px;padding:16px 20px;margin:14px 0;cursor:pointer}
.champ.actif{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.champ.fixe{cursor:default;background:var(--bg)}
.champ .lib{font-size:16px;font-weight:800;color:var(--muted)}
.champ .val{font-family:var(--mono);font-size:44px;font-weight:800;min-height:58px;letter-spacing:.02em}
.champ .val.vide{color:var(--border)}
.champ .src{font-size:14px;color:var(--muted);margin-top:2px}
.curseur{display:inline-block;width:3px;height:42px;background:var(--accent);vertical-align:-6px;margin-left:2px;animation:clig 1s steps(1) infinite}
@keyframes clig{50%{opacity:0}}
.calcul{display:flex;justify-content:space-between;font-family:var(--mono);font-size:22px;font-weight:800;
  background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px 20px}
.msg-err{color:var(--err);font-weight:800;margin-top:10px;font-size:18px}

/* Clavier numérique */
.pave{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:var(--panel);border:1px solid var(--border);
  border-radius:24px;padding:14px;box-shadow:var(--ombre)}
.touche{font:inherit;font-size:34px;font-weight:800;font-family:var(--mono);height:82px;border-radius:18px;cursor:pointer;
  border:2px solid var(--border);background:var(--touche);color:var(--text)}
.touche:active{background:var(--accent-soft);border-color:var(--accent)}
.touche.eff{font-size:28px;color:var(--err)}
.pave .vide{visibility:hidden}

/* Billetterie */
.billets{display:grid;gap:10px}
.billet{display:grid;grid-template-columns:120px 1fr 1fr;gap:10px;align-items:center}
.billet .coup{font-size:24px;font-weight:900;white-space:nowrap}
.billet .coup small{display:block;font-size:14px;font-weight:700;color:var(--muted);font-family:var(--mono)}
.case-n{background:var(--panel);border:3px solid var(--border);border-radius:16px;padding:8px 12px;cursor:pointer;text-align:center}
.case-n .lib{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.case-n .val{font-family:var(--mono);font-size:30px;font-weight:800;min-height:40px}
.case-n.actif{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.case-n.zero .val{color:var(--border)}
.entete-billets{display:grid;grid-template-columns:120px 1fr 1fr;gap:10px;font-size:14px;font-weight:800;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em;padding:0 0 2px}
.entete-billets span{text-align:center}
.entete-billets span:first-child{text-align:left}

/* Tableaux / récap */
table{width:100%;border-collapse:collapse}
th,td{padding:12px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{font-size:14px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right;white-space:nowrap}
.num{font-family:var(--mono)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;font-weight:800;font-size:19px}
.total .v{font-family:var(--mono);font-size:24px}
.ecart{border-radius:18px;padding:18px 20px;font-weight:900;font-size:22px;display:flex;justify-content:space-between;margin-top:6px}
.ecart.ok{background:var(--ok-soft);color:var(--ok)}
.ecart.neg{background:var(--err-soft);color:var(--err)}
.ecart.pos{background:var(--warn-soft);color:var(--warn)}
.alerte{border-radius:18px;padding:16px 20px;margin-bottom:16px;font-weight:800}
.alerte.err{background:var(--err-soft);color:var(--err)}
.alerte.ok{background:var(--ok-soft);color:var(--ok)}
.alerte.warn{background:var(--warn-soft);color:var(--warn)}
.charte li{margin-bottom:14px;font-size:19px}
.case{display:flex;gap:14px;align-items:center;margin:18px 0 4px;font-weight:900;font-size:22px;
  background:var(--accent-soft);border:3px solid var(--accent);border-radius:18px;padding:18px;cursor:pointer}
.case input{width:36px;height:36px;flex:none;margin:0;accent-color:var(--accent)}
.badge{display:inline-block;font-size:14px;font-weight:800;border-radius:20px;padding:3px 12px}
.badge.SOUMIS{background:var(--warn-soft);color:var(--warn)}
.badge.PROBLEME{background:var(--err-soft);color:var(--err)}
.badge.CONFIRME,.badge.RESOLU{background:var(--ok-soft);color:var(--ok)}
.badge.REJETE{background:var(--err-soft);color:var(--err)}
.hist{border-bottom:1px solid var(--border);padding:12px 0}
.hist:last-child{border:0}
.com{margin-top:8px;font-size:16px;background:var(--bg);border-radius:12px;padding:10px 12px}
.section-tete{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.section-tete h2{margin:0}
.produit-tete{font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin:8px 0 2px}
.btn-mod{font:inherit;font-weight:800;font-size:16px;border-radius:12px;padding:10px 16px;cursor:pointer;
  background:var(--accent-soft);color:var(--accent-2);border:2px solid var(--accent)}
.retirer{flex:none;width:48px;height:48px;border-radius:14px;border:2px solid var(--border);background:transparent;
  color:var(--muted);font-size:18px;cursor:pointer}
.barre-bas{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--border);
  padding:14px 24px calc(14px + env(safe-area-inset-bottom));z-index:6;box-shadow:0 -4px 18px rgba(15,23,42,.06)}
.barre-bas .in{max-width:1060px;margin:0 auto;display:flex;gap:16px;align-items:center}
.barre-bas .info{flex:1;font-size:16px;color:var(--muted)}
.barre-bas .info b{display:block;color:var(--text);font-family:var(--mono);font-size:24px}
.barre-bas .btn{width:auto;flex:none;min-width:260px}
.cache{display:none!important}
.connexion{max-width:520px;margin:5vh auto 0}
@media (max-width:600px){
  html,body{font-size:17px} main{padding:16px 14px 140px} header{padding:12px 14px}
  h1{font-size:26px} .pompe-titre{font-size:30px} .champ .val{font-size:36px}
  .touche{height:64px;font-size:28px} .barre-bas .btn{min-width:160px;font-size:18px}
  .billet,.entete-billets{grid-template-columns:86px 1fr 1fr} .billet .coup{font-size:19px} .case-n .val{font-size:24px}
}
</style>
</head>
<body>
<div class="env cache" id="env"></div>
<header>
  <div class="marque" id="marque">KONEKTA</div>
  <div class="qui cache" id="qui"></div>
  <button class="btn sec petit cache" id="btn-sortir" onclick="deconnexion()">Sortir</button>
</header>

<main id="app"></main>
<div class="barre-bas cache" id="barre"><div class="in">
  <div class="info" id="barre-info"></div>
  <button class="btn" id="barre-btn"></button>
</div></div>

<script>
'use strict';
/* Espace pompiste, pensé pour une tablette : une question par écran, gros
   boutons, clavier de chiffres à l'écran (pas de clavier système).
   1. Compteurs, carburant par carburant :
      charte → période → carburant → pompes → index (une pompe par écran)
      → vérification → « Envoyer les compteurs » → mon rapport
      (« Ajouter un autre carburant » ou « Terminer »)
   2. Au « Terminer » : billetterie de toute la période → résumé complet,
      chaque ligne modifiable → envoi au superviseur. */
const S = {};
function reinit(){
  Object.assign(S, {ctx:null, etape:'charte', charte:false, date:null, periode:null, produitId:null,
    choisies:[], pos:0, index:{}, billets:{}, monnaie:'', note:'', erreurs:{}, dernier:null,
    champ:null, modif:null, depuisResume:false});
}
reinit();

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const nf = (n,d=0) => Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const G = n => nf(n) + ' G';
const signe = n => (n > 0 ? '+' : '') + G(n);
const per = p => p === 'Apres-midi' ? 'Après-midi' : p;
const num = v => { if(v == null || String(v).trim() === '') return null;
  const x = parseFloat(String(v).replace(',', '.').replace(/\s/g,'')); return isNaN(x) ? null : x; };
const ent = v => { const x = parseInt(v,10); return isNaN(x) || x < 0 ? 0 : x; };
const jourTxt = iso => new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long', day:'numeric', month:'long'});
const hier = iso => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate()-1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

async function api(method, url, body){
  const r = await fetch(url, {method, credentials:'include',
    headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined});
  let d = null; try{ d = await r.json(); }catch(e){}
  if(!r.ok){ const e = new Error(typeof d?.detail === 'string' ? d.detail : (d?.detail?.message || 'Erreur ' + r.status));
    e.status = r.status; e.detail = d?.detail; throw e; }
  return d;
}

// ── Clavier numérique à l'écran ─────────────────────────────────────
// S.champ = {get, set, decimal, max, apres}  — le champ que le clavier remplit.
function pave(decimal){
  const t = ['1','2','3','4','5','6','7','8','9', decimal ? ',' : '', '0', '⌫'];
  return `<div class="pave">${t.map(k => k ? `<button class="touche ${k==='⌫'?'eff':''}" data-k="${k}" aria-label="${k==='⌫'?'Effacer':k}">${k}</button>`
                                         : '<span class="vide"></span>').join('')}</div>`;
}
function taper(k){
  const c = S.champ; if(!c) return;
  let v = c.get() || '';
  if(k === '⌫') v = v.slice(0, -1);
  else if(k === ',' || k === '.'){ if(!c.decimal || v.includes('.')) return; v = (v || '0') + '.'; }
  else { if(v.replace('.','').length >= (c.max || 12)) return; if(v === '0') v = ''; v += k; }
  c.set(v);
  c.apres && c.apres();
}
document.addEventListener('click', e => { const t = e.target.closest('.touche'); if(t) taper(t.dataset.k); });
document.addEventListener('keydown', e => {          // clavier physique (tablette avec clavier, tests)
  if(!S.champ || e.target.matches('input,textarea')) return;
  if(/^[0-9]$/.test(e.key)) taper(e.key);
  else if(e.key === ',' || e.key === '.') taper('.');
  else if(e.key === 'Backspace') taper('⌫');
  else if(e.key === 'Enter'){ const b = $('barre-btn'); if(!$('barre').classList.contains('cache') && !b.disabled) b.click(); }
  else return;
  e.preventDefault();
});
const affiche = (v, actif) => (v ? esc(v.replace('.', ',')) : '') + (actif ? '<span class="curseur"></span>' : '');

// ── Démarrage / connexion ───────────────────────────────────────────
async function demarrer(){
  try{
    const b = await api('GET','/api/config/branding');
    if(b?.nom) $('marque').textContent = b.nom;
    if(b?.environnement && b.environnement !== 'production'){
      $('env').textContent = String(b.environnement).toUpperCase() + ' — environnement de test';
      $('env').classList.remove('cache');
    }
  }catch(e){}
  await chargerContexte();
}

async function chargerContexte(){
  try{
    const q = S.date && S.periode ? `?date=${S.date}&periode=${S.periode}` : '';
    S.ctx = await api('GET','/api/pompiste/contexte' + q);
    if(S.ctx.en_cours){
      S.date = S.ctx.date; S.periode = S.ctx.periode;
      if(S.charte && ['charte','periode'].includes(S.etape)) S.etape = 'rapport';
    }
    if(!S.date) S.date = S.ctx.aujourd_hui;
    $('qui').innerHTML = `<b>${esc(S.ctx.pompiste.nom)}</b><span>${esc(S.ctx.pompiste.username)}</span>`;
    $('qui').classList.remove('cache'); $('btn-sortir').classList.remove('cache');
    rendre();
  }catch(e){
    if(e.status === 401) return ecranConnexion();
    if(e.status === 403) return ecranPasPompiste();
    sansBarre();
    $('app').innerHTML = `<div class="alerte err">${esc(e.message)}</div>
      <button class="btn" onclick="chargerContexte()">Réessayer</button>`;
  }
}

function ecranConnexion(msg){
  S.champ = null;
  $('barre').classList.add('cache'); $('qui').classList.add('cache'); $('btn-sortir').classList.add('cache');
  $('app').innerHTML = `<div class="connexion">
    <h1>Espace pompiste</h1><p class="sub">Entrez votre code et votre PIN.</p>
    ${msg ? `<div class="alerte err">${esc(msg)}</div>` : ''}
    <form class="card" id="f-login" autocomplete="on">
      <label for="l-user">Mon code</label>
      <input id="l-user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required
        placeholder="ex. jeanpierre4821" style="font-family:var(--mono);font-size:24px">
      <label for="l-pin">Mon PIN (9 chiffres)</label>
      <input id="l-pin" type="password" inputmode="numeric" maxlength="9" autocomplete="current-password" required
        style="font-family:var(--mono);font-size:30px;letter-spacing:.3em;text-align:center">
      <div style="height:18px"></div>
      <button class="btn" id="l-btn">Se connecter</button>
    </form></div>`;
  $('l-user').focus();
  $('f-login').onsubmit = async ev => {
    ev.preventDefault();
    const pin = $('l-pin').value.trim();
    if(!/^\d{9}$/.test(pin)) return ecranConnexion('Le PIN contient 9 chiffres.');
    $('l-btn').disabled = true;
    try{
      await api('POST','/api/login/pompiste',{username:$('l-user').value.trim(), code_acces:pin});
      reinit();
      await chargerContexte();
    }catch(e){ ecranConnexion(e.message); }
  };
}

function ecranPasPompiste(){
  $('app').innerHTML = `<div class="connexion card"><h1>Compte non pompiste</h1>
    <p class="sub">Vous êtes connecté avec un compte qui n'est pas un compte pompiste.</p>
    <button class="btn" onclick="location.href='/'">Aller à l'application</button></div>`;
}

async function deconnexion(){
  try{ await api('POST','/api/logout'); }catch(e){}
  reinit();
  ecranConnexion();
}

// ── Navigation ──────────────────────────────────────────────────────
const enCours = () => S.ctx?.en_cours;
const produit = () => S.ctx.produits.find(p => p.id === S.produitId);
const pompeCtx = id => { for(const p of S.ctx.produits) for(const q of p.pompes) if(q.id === id) return q; return null; };
const PHASE_ARGENT = ['billetterie','resume','modif'];

function aller(etape){ S.etape = etape; rendre(); }
function precedent(){
  const e = S.etape;
  if(e === 'index' && S.pos > 0){ S.pos--; S.champActif = null; return rendre(); }
  if(e === 'billetterie' && S.depuisResume) return aller('resume');
  const retour = {periode:'charte', produit: enCours() ? 'rapport' : 'periode', pompes:'produit', index:'pompes',
                  compteurs:'index', billetterie:'rapport', resume:'billetterie', modif:'resume'}[e];
  if(e === 'compteurs'){ S.pos = S.choisies.length - 1; S.champActif = null; }
  aller(retour || 'charte');
}

function entete(titrePhase){
  const puces = [];
  if(S.periode && !['periode','charte'].includes(S.etape)) puces.push(per(S.periode) + (S.date !== S.ctx.aujourd_hui ? ' (hier)' : ''));
  if(S.produitId && ['pompes','index','compteurs'].includes(S.etape)) puces.push(produit()?.nom || '');
  if(S.choisies.length && ['index','compteurs'].includes(S.etape))
    puces.push(S.choisies.length + ' pompe' + (S.choisies.length > 1 ? 's' : ''));
  const phase = titrePhase ?? (PHASE_ARGENT.includes(S.etape) ? 'Étape 2 · Argent' : 'Étape 1 · Compteurs');
  const avecRetour = !['charte','rapport'].includes(S.etape);
  return `<div class="fil">${avecRetour ? '<button class="retour" onclick="precedent()">← Retour</button>' : ''}
      <span class="pas">${phase}</span></div>
    ${puces.length ? `<div class="resume">${puces.map(p=>`<span>${esc(p)}</span>`).join('')}</div>` : ''}`;
}

function barre(info, libelle, action, actif=true){
  $('barre').classList.remove('cache');
  $('barre-info').innerHTML = info;
  const b = $('barre-btn'); b.textContent = libelle; b.onclick = action; b.disabled = !actif;
}
const sansBarre = () => $('barre').classList.add('cache');

function rendre(){
  if(!S.charte && S.etape !== 'fin') S.etape = 'charte';
  S.champ = null;
  ({charte:rCharte, periode:rPeriode, produit:rProduit, pompes:rPompes, index:rIndex, compteurs:rCompteurs,
    rapport:rRapport, billetterie:rBilletterie, resume:rResume, modif:rModif, fin:rFin})[S.etape]();
  window.scrollTo(0,0);
}

// ── Charte ──────────────────────────────────────────────────────────
function rCharte(){
  $('app').innerHTML = entete('') + `
    <h1>Charte de responsabilité</h1>
    <p class="sub">Lisez et acceptez avant de commencer.</p>
    <div class="card charte"><ul style="padding-left:22px;margin:0">
      <li>Je lis moi-même les <b>vrais index</b> sur chaque pompe.</li>
      <li>Je compte l'argent <b>billet par billet</b> et je déclare exactement ce que je remets.</li>
      <li>Ce que je saisis avec mon code <b>m'engage</b> : mon nom, la date et l'heure sont enregistrés.</li>
      <li>Mon rapport est vérifié par la direction. En cas de doute, je préviens mon responsable.</li>
    </ul>
    <label class="case"><input type="checkbox" id="c-ok" ${S.charte?'checked':''}> J'ai lu et j'accepte</label></div>
    ${enCours() ? `<div class="alerte warn">Vous avez un rapport commencé
      (${per(enCours().periode)}, ${esc(jourTxt(enCours().date))}) : vous allez le reprendre.</div>` : ''}
    <h2>Mes derniers rapports</h2><div class="card" id="hist"><span class="sub">Chargement…</span></div>`;
  const maj = () => barre('', enCours() ? 'Reprendre mon rapport' : 'Commencer',
    ()=>{ S.charte = true; aller(enCours() ? 'rapport' : 'periode'); }, $('c-ok').checked);
  $('c-ok').onchange = maj; maj();
  chargerHistorique();
}

// ── 1. Période ──────────────────────────────────────────────────────
function rPeriode(){
  sansBarre();
  const auj = S.date === S.ctx.aujourd_hui;
  $('app').innerHTML = entete() + `
    <h1>Quelle période ?</h1>
    <p class="sub">${auj ? "Aujourd'hui" : 'Hier'}, ${esc(jourTxt(S.date))}</p>
    <div class="choix deux">
      <button class="gros grand ${S.periode==='Matin'?'on':''}" onclick="choisirPeriode('Matin')">
        <span class="ico">☀️</span><span>Matin</span></button>
      <button class="gros grand ${S.periode==='Apres-midi'?'on':''}" onclick="choisirPeriode('Apres-midi')">
        <span class="ico">🌇</span><span>Après-midi</span></button>
    </div>
    <button class="lien" onclick="basculerJour()">${auj ? 'Le rapport est pour hier ?' : "Revenir à aujourd'hui"}</button>`;
}
function basculerJour(){
  S.date = S.date === S.ctx.aujourd_hui ? hier(S.ctx.aujourd_hui) : S.ctx.aujourd_hui;
  S.periode = null; rPeriode();
}
async function choisirPeriode(p){
  if(p !== S.periode){ S.produitId = null; S.choisies = []; S.index = {}; S.erreurs = {}; }
  S.periode = p; S.etape = 'produit';
  await chargerContexte();
}

// ── 2. Carburant ────────────────────────────────────────────────────
function rProduit(){
  sansBarre();
  const cls = n => /diesel/i.test(n) ? 'die' : (/gaz|essence/i.test(n) ? 'gaz' : '');
  $('app').innerHTML = entete() + `
    <h1>${enCours() ? 'Quel autre carburant ?' : 'Quel carburant ?'}</h1>
    <p class="sub">Touchez le carburant de vos pompes.</p>
    <div class="choix deux">${S.ctx.produits.map(p => {
      const libres = p.pompes.filter(q => !q.deja_rapportee).length;
      return `<button class="gros grand ${cls(p.nom)} ${S.produitId===p.id?'on':''}" onclick="choisirProduit(${p.id})" ${libres?'':'disabled'}>
        <span class="ico">⛽</span><span>${esc(p.nom)}<small>${libres ? `${p.pompes.length} pompe${p.pompes.length>1?'s':''} · ${nf(p.prix_gallon,2)} G/gal`
          : 'Toutes les pompes sont déjà saisies'}</small></span></button>`;
    }).join('')}</div>`;
}
function choisirProduit(id){
  if(id !== S.produitId){ S.choisies = []; S.index = {}; S.erreurs = {}; }
  S.produitId = id; aller('pompes');
}

// ── 3. Pompes ───────────────────────────────────────────────────────
function rPompes(){
  const p = produit();
  $('app').innerHTML = entete() + `
    <h1>Quelles pompes ?</h1>
    <p class="sub">Touchez chaque pompe que vous avez tenue.</p>
    <div class="choix trois">${p.pompes.map(q => {
      const on = S.choisies.includes(q.id), prise = q.deja_rapportee;
      return `<button class="gros ${on?'on':''} ${S.erreurs[q.id]?'erreur':''}" onclick="basculerPompe(${q.id})" ${prise?'disabled':''}>
        <span>${esc(q.nom)}<small>${prise ? (prise.moi ? 'Déjà dans votre rapport' : 'Déjà saisie par ' + esc(prise.par))
          : (q.index_precedent != null ? 'Dernier index : ' + nf(q.index_precedent,3) : 'Aucun index précédent')}</small></span>
        <span class="coche">✓</span></button>`;
    }).join('')}</div>`;
  const n = S.choisies.length;
  barre(n ? `<b>${n} pompe${n>1?'s':''}</b>choisie${n>1?'s':''}` : 'Aucune pompe choisie', 'Continuer',
        ()=>{ S.pos = 0; S.champActif = null; aller('index'); }, n > 0);
}
function basculerPompe(id){
  const p = produit();
  S.choisies = S.choisies.includes(id) ? S.choisies.filter(x => x !== id) : [...S.choisies, id];
  S.choisies.sort((a,b) => p.pompes.findIndex(q=>q.id===a) - p.pompes.findIndex(q=>q.id===b));
  rPompes();
}

// ── 4. Index — une pompe par écran, clavier à l'écran ───────────────
function valeurs(id){
  const q = pompeCtx(id), s = S.index[id] || {};
  const av = q.index_precedent != null ? q.index_precedent : num(s.avant);
  const ap = num(s.apres);
  return {q, av, ap, g: av != null && ap != null ? ap - av : null};
}

/* Écran d'index partagé par la saisie (étape 4) et la modification depuis
   le résumé : `id` = pompe, `prix` = prix/gal, `fin(ok, v)` = barre du bas. */
function ecranIndex(id, prix, titreHaut, fin){
  const q = pompeCtx(id), s = (S.index[id] ||= {}), connu = q.index_precedent != null;
  if(!S.champActif || S.champActif.id !== id) S.champActif = {id, k: connu || s.avant ? 'apres' : 'avant'};
  const dessin = () => {
    const k = S.champActif.k, v = valeurs(id);
    $('z-avant').innerHTML = connu
      ? `<div class="lib">Index de début</div><div class="val">${nf(q.index_precedent,3)}</div>
         <div class="src">Repris du ${esc(q.index_precedent_source)}</div>`
      : `<div class="lib">Index de début — touchez pour saisir</div>
         <div class="val ${s.avant?'':'vide'}">${affiche(s.avant, k==='avant') || '0'}</div>
         <div class="src">Pas d'index précédent : lisez aussi l'index de début.</div>`;
    $('z-avant').className = 'champ ' + (connu ? 'fixe' : (k === 'avant' ? 'actif' : ''));
    $('z-apres').innerHTML = `<div class="lib">Index de fin — lu sur la pompe</div>
      <div class="val ${s.apres?'':'vide'}">${affiche(s.apres, k==='apres') || '0'}</div>`;
    $('z-apres').className = 'champ ' + (k === 'apres' ? 'actif' : '');
    const ok = v.av != null && v.ap != null && v.g >= 0;
    $('i-calc').innerHTML = v.g == null ? ''
      : (v.g < 0 ? `<div class="msg-err">L'index de fin doit être plus grand que l'index de début.</div>`
                 : `<div class="calcul"><span>${nf(v.g,3)} gal</span><span>${G(v.g * prix)}</span></div>`);
    fin(ok, v);
  };
  const choisir = k => {
    if(k === 'avant' && connu) return;
    S.champActif.k = k;
    S.champ = {decimal:true, max:12, get:()=>s[k] || '', set:x=>{ s[k] = x; delete S.erreurs[id]; }, apres:dessin};
    dessin();
  };
  $('app').innerHTML = entete() + `<div class="deux-col"><div>
      ${titreHaut}
      <h1 class="pompe-titre">${esc(q.nom)}</h1>
      ${S.erreurs[id] ? `<div class="alerte err" style="margin-top:14px">${esc(S.erreurs[id])}</div>` : ''}
      <div id="z-avant"></div><div id="z-apres"></div><div id="i-calc"></div>
    </div><div class="cote">${pave(true)}</div></div>`;
  $('z-avant').onclick = () => choisir('avant');
  $('z-apres').onclick = () => choisir('apres');
  choisir(S.champActif.k);
}

function rIndex(){
  const id = S.choisies[S.pos], dernier = S.pos === S.choisies.length - 1;
  ecranIndex(id, produit().prix_gallon, `<p class="sub" style="margin:0">Pompe ${S.pos+1} sur ${S.choisies.length}</p>`,
    (ok, v) => barre(ok ? `<b>${nf(v.g,3)} gal</b>vendus` : 'Tapez l\'index de fin', dernier ? 'Vérifier' : 'Pompe suivante →',
      ()=>{ S.champActif = null; if(dernier) aller('compteurs'); else { S.pos++; rendre(); } }, ok));
}

// ── 5. Vérification des compteurs de ce carburant ───────────────────
function lignes(){
  return S.choisies.map(id => { const v = valeurs(id); return {...v, montant: v.g * produit().prix_gallon}; });
}
function rCompteurs(){
  const l = lignes(), tot = l.reduce((a,x)=>a+x.montant,0), gal = l.reduce((a,x)=>a+x.g,0);
  $('app').innerHTML = entete() + `<h1>Vérifiez vos compteurs</h1>
    <p class="sub">${esc(produit().nom)} · ${per(S.periode)}, ${esc(jourTxt(S.date))}</p>
    <div class="card"><table><thead><tr><th>Pompe</th><th class="r">Début</th><th class="r">Fin</th><th class="r">Gallons</th><th></th></tr></thead><tbody>
      ${l.map((x,i)=>`<tr><td><b>${esc(x.q.nom)}</b></td><td class="r num">${nf(x.av,3)}</td><td class="r num">${nf(x.ap,3)}</td>
        <td class="r num"><b>${nf(x.g,3)}</b></td><td class="r"><button class="btn-mod" onclick="S.pos=${i};S.champActif=null;aller('index')">Modifier</button></td></tr>`).join('')}
    </tbody></table>
    <div class="total"><span>Total</span><span class="v">${nf(gal,3)} gal</span></div>
    <div class="total" style="padding-top:0"><span>Montant</span><span class="v">${G(tot)}</span></div></div>
    <p class="sub">L'argent se compte à la fin, quand vous appuierez sur « Terminer ».</p>`;
  barre(`<b>${G(tot)}</b>${esc(produit().nom)}`, 'Envoyer les compteurs', envoyerCompteurs);
}

async function envoyerCompteurs(){
  const b = $('barre-btn'); b.disabled = true; b.textContent = 'Envoi…';
  try{
    await api('POST','/api/pompiste/compteurs',{
      date:S.date, periode:S.periode, charte_acceptee:S.charte,
      lignes: lignes().map(x=>({pompe_id:x.q.id, metter_avant:x.av, metter_apres:x.ap}))});
    S.produitId = null; S.choisies = []; S.index = {}; S.erreurs = {};
    S.etape = 'rapport';
    await chargerContexte();
  }catch(e){
    if(e.status === 422 && e.detail?.erreurs){
      S.erreurs = {}; for(const x of e.detail.erreurs) S.erreurs[x.pompe_id] = x.message;
      S.pos = Math.max(0, S.choisies.findIndex(id => S.erreurs[id])); S.etape = 'index'; S.champActif = null;
      await chargerContexte();
      return;
    }
    if(e.status === 401) return ecranConnexion('Session expirée — reconnectez-vous.');
    b.disabled = false; b.textContent = 'Envoyer les compteurs';
    $('app').insertAdjacentHTML('afterbegin', `<div class="alerte err">${esc(e.message)}</div>`);
    window.scrollTo(0,0);
  }
}

// ── 6. Mon rapport : ajouter un autre carburant ou terminer ─────────
function lignesParProduit(r){
  const g = {}; for(const l of r.lignes) (g[l.produit_nom] ||= []).push(l); return g;
}
function rRapport(){
  const r = enCours();
  if(!r){ S.etape = 'periode'; return rPeriode(); }
  const reste = S.ctx.produits.some(p => p.pompes.some(q => !q.deja_rapportee));
  sansBarre();
  $('app').innerHTML = entete('Compteurs envoyés') + `
    <h1>Mon rapport</h1>
    <p class="sub">${per(r.periode)}, ${esc(jourTxt(r.date))}</p>
    <div class="deux-col"><div class="card">${Object.entries(lignesParProduit(r)).map(([nom, ls]) => `
      <div class="produit-tete">${esc(nom)}</div>
      <table><tbody>${ls.map(l => `<tr><td><b>${esc(l.pompe_nom)}</b>
          <div style="font-size:15px;color:var(--muted)" class="num">${nf(l.metter_avant,3)} → ${nf(l.metter_apres,3)}</div></td>
        <td class="r num">${nf(l.gallons,3)} gal<div style="font-size:15px;color:var(--muted)">${G(l.montant)}</div></td>
        <td class="r" style="width:56px"><button class="retirer" onclick="retirerPompe(${l.pompe_id})" aria-label="Retirer">✕</button></td></tr>`).join('')}
      </tbody></table>`).join('')}
      <div class="total"><span>Ventes attendues</span><span class="v">${G(r.montant_attendu)}</span></div></div>
    <div class="choix">
      ${reste ? `<button class="gros" onclick="aller('produit')"><span class="ico">＋</span>
        <span>Ajouter un autre carburant<small>Si vous avez tenu d'autres pompes</small></span></button>` : ''}
      <button class="gros on" onclick="S.depuisResume=false;aller('billetterie')"><span class="ico">✔</span>
        <span>Terminer<small>Toutes mes pompes sont envoyées : je compte l'argent</small></span></button>
    </div></div>`;
}
async function retirerPompe(id){
  const l = enCours().lignes.find(x => x.pompe_id === id);
  if(!confirm(`Retirer ${l.pompe_nom} de votre rapport ? Vous pourrez la saisir à nouveau.`)) return;
  try{ await api('DELETE', `/api/pompiste/compteurs/${id}`); }catch(e){ alert(e.message); }
  await chargerContexte();
}

// ── 7. Billetterie (après « Terminer ») ─────────────────────────────
function totalCompte(){
  let t = 0;
  for(const c of S.ctx.coupures){ const b = S.billets[c] || {}; t += c * (ent(b.liasses) * S.ctx.taille_liasse + ent(b.billets)); }
  return t + (num(S.monnaie) || 0);
}
function rBilletterie(){
  if(!enCours()) return aller('periode');
  const c = S.ctx;
  if(!S.caseActive) S.caseActive = {c: c.coupures[0], k: 'billets'};
  const cle = (k, champ) => `${k}-${champ}`;
  $('app').innerHTML = entete() + `<div class="deux-col"><div>
      <h1>Comptez l'argent</h1>
      <p class="sub">Tout l'argent de la période. Touchez une case, puis tapez le nombre.
        Une liasse = ${c.taille_liasse} billets.</p>
      <div class="card"><div class="entete-billets"><span>Billet</span><span>Liasses</span><span>Billets</span></div>
      <div class="billets">${c.coupures.map(k => `
        <div class="billet"><div class="coup">${nf(k)} G<small id="st-${k}"></small></div>
          <div class="case-n" data-c="${k}" data-k="liasses" id="cs-${cle(k,'liasses')}"><div class="lib">Liasses</div><div class="val"></div></div>
          <div class="case-n" data-c="${k}" data-k="billets" id="cs-${cle(k,'billets')}"><div class="lib">Billets</div><div class="val"></div></div>
        </div>`).join('')}
        <div class="billet"><div class="coup">Monnaie<small>pièces, en G</small></div>
          <div class="case-n" data-c="monnaie" data-k="montant" id="cs-monnaie" style="grid-column:span 2"><div class="lib">Montant</div><div class="val"></div></div></div>
      </div></div></div>
    <div class="cote">${pave(false)}
      <div class="calcul" style="margin-top:14px"><span>Total</span><span id="b-total"></span></div></div></div>`;
  const dessin = () => {
    for(const k of c.coupures) for(const ch of ['liasses','billets']){
      const el = $('cs-' + cle(k,ch)), v = (S.billets[k] || {})[ch] || '';
      const act = S.caseActive.c === k && S.caseActive.k === ch;
      el.className = 'case-n' + (act ? ' actif' : '') + (v ? '' : ' zero');
      el.querySelector('.val').innerHTML = affiche(v, act) || '0';
      const b = S.billets[k] || {}, n = ent(b.liasses) * c.taille_liasse + ent(b.billets);
      $('st-' + k).textContent = n ? G(n * k) : '';
    }
    const actM = S.caseActive.c === 'monnaie', m = $('cs-monnaie');
    m.className = 'case-n' + (actM ? ' actif' : '') + (S.monnaie ? '' : ' zero');
    m.querySelector('.val').innerHTML = affiche(S.monnaie, actM) || '0';
    $('b-total').textContent = G(totalCompte());
    barre(`Total compté<b>${G(totalCompte())}</b>`, 'Voir le résumé →', ()=>{ S.caseActive = null; aller('resume'); });
  };
  const activer = (k, ch) => {
    S.caseActive = {c:k, k:ch};
    S.champ = k === 'monnaie'
      ? {decimal:true, max:9, get:()=>S.monnaie, set:v=>{ S.monnaie = v; }, apres:dessin}
      : {decimal:false, max:5, get:()=>(S.billets[k] || {})[ch] || '', set:v=>{ (S.billets[k] ||= {})[ch] = v; }, apres:dessin};
    dessin();
  };
  document.querySelectorAll('.case-n').forEach(el => el.onclick = () =>
    activer(el.dataset.c === 'monnaie' ? 'monnaie' : Number(el.dataset.c), el.dataset.k));
  activer(S.caseActive.c, S.caseActive.k);
}

// ── 8. Résumé complet avant l'envoi, tout est modifiable ────────────
function rResume(){
  const r = enCours(), att = r.montant_attendu, cpt = totalCompte(), ec = cpt - att;
  const cls = Math.abs(ec) < 1 ? 'ok' : (ec < 0 ? 'neg' : 'pos');
  const txt = Math.abs(ec) < 1 ? 'Caisse juste' : (ec < 0 ? 'Il manque' : 'En plus');
  const billets = S.ctx.coupures.map(c => ({c, b:S.billets[c] || {}}))
    .map(x => ({...x, n: ent(x.b.liasses) * S.ctx.taille_liasse + ent(x.b.billets)})).filter(x => x.n);
  $('app').innerHTML = entete() + `<h1>Résumé de mon rapport</h1>
    <p class="sub">${per(r.periode)}, ${esc(jourTxt(r.date))}. Vérifiez tout. Touchez « Modifier » s'il y a une erreur.</p>
    <div class="card"><div class="section-tete"><h2>Mes compteurs</h2></div>
      ${Object.entries(lignesParProduit(r)).map(([nom, ls]) => `<div class="produit-tete">${esc(nom)}</div>
        <table><tbody>${ls.map(l => `<tr><td><b>${esc(l.pompe_nom)}</b></td>
          <td class="r num">${nf(l.metter_avant,3)} → ${nf(l.metter_apres,3)}</td>
          <td class="r num"><b>${nf(l.gallons,3)} gal</b><div style="font-size:15px;color:var(--muted)">${G(l.montant)}</div></td>
          <td class="r" style="width:120px"><button class="btn-mod" onclick="modifierPompe(${l.pompe_id})">Modifier</button></td></tr>`).join('')}
        </tbody></table>`).join('')}
      <div class="total"><span>Ventes attendues</span><span class="v">${G(att)}</span></div></div>
    <div class="card"><div class="section-tete"><h2>Mon argent</h2>
        <button class="btn-mod" onclick="S.depuisResume=true;aller('billetterie')">Modifier</button></div>
      ${billets.length || num(S.monnaie) ? `<table><tbody>
        ${billets.map(x => `<tr><td><b>${nf(x.c)} G</b></td>
          <td class="r num">${ent(x.b.liasses) ? `${ent(x.b.liasses)} liasse${ent(x.b.liasses)>1?'s':''} + ` : ''}${ent(x.b.billets)} billet${ent(x.b.billets)>1?'s':''}</td>
          <td class="r num"><b>${G(x.n * x.c)}</b></td></tr>`).join('')}
        ${num(S.monnaie) ? `<tr><td><b>Monnaie</b></td><td></td><td class="r num"><b>${G(num(S.monnaie))}</b></td></tr>` : ''}
      </tbody></table>` : '<p class="sub" style="margin:0">Aucun argent saisi.</p>'}
      <div class="total"><span>Argent compté</span><span class="v">${G(cpt)}</span></div></div>
    <div class="card">
      <div class="ecart ${cls}"><span>${txt}</span><span>${signe(ec)}</span></div>
      <label for="r-note">Un mot pour la direction ? (facultatif)</label>
      <textarea id="r-note" rows="3" maxlength="500" placeholder="Ex. : client parti sans payer…">${esc(S.note)}</textarea></div>`;
  $('r-note').oninput = e => S.note = e.target.value;
  barre(`Écart<b>${signe(ec)}</b>`, 'Envoyer mon rapport', terminer);
}

function modifierPompe(id){
  const l = enCours().lignes.find(x => x.pompe_id === id), q = pompeCtx(id);
  S.modif = id; S.champActif = null;
  S.index[id] = {avant: q.index_precedent != null ? '' : String(l.metter_avant), apres: String(l.metter_apres)};
  aller('modif');
}
function rModif(){
  const id = S.modif, l = enCours().lignes.find(x => x.pompe_id === id);
  ecranIndex(id, l.prix_gallon, `<p class="sub" style="margin:0">Modifier — ${esc(l.produit_nom)}</p>`,
    (ok, v) => barre(ok ? `<b>${nf(v.g,3)} gal</b>vendus` : '', 'Enregistrer', async () => {
      try{
        await api('PUT', `/api/pompiste/compteurs/${id}`, {metter_avant:v.av, metter_apres:v.ap});
        S.modif = null; S.champActif = null; S.etape = 'resume';
        await chargerContexte();
      }catch(e){
        S.erreurs[id] = e.detail?.erreurs?.[0]?.message || e.message; rendre();
      }
    }, ok));
}

async function terminer(){
  const b = $('barre-btn'); b.disabled = true; b.textContent = 'Envoi…';
  try{
    S.dernier = await api('POST','/api/pompiste/terminer',{
      billetterie: S.ctx.coupures.map(c=>({coupure:c, liasses:ent(S.billets[c]?.liasses), billets:ent(S.billets[c]?.billets)}))
                     .filter(x=>x.liasses||x.billets),
      monnaie: num(S.monnaie) || 0, note: S.note || null});
    aller('fin');
  }catch(e){
    if(e.status === 401) return ecranConnexion('Session expirée — reconnectez-vous.');
    b.disabled = false; b.textContent = 'Envoyer mon rapport';
    $('app').insertAdjacentHTML('afterbegin', `<div class="alerte err">${esc(e.message)}</div>`);
    window.scrollTo(0,0);
  }
}

// ── Envoyé ──────────────────────────────────────────────────────────
function rFin(){
  const r = S.dernier;
  sansBarre();
  $('app').innerHTML = `<div style="max-width:640px;margin:0 auto">
    <div style="text-align:center;font-size:80px;margin-top:10px">✅</div>
    <h1 style="text-align:center">Rapport envoyé</h1>
    <p class="sub" style="text-align:center">La direction a été prévenue et va le vérifier.</p>
    <div class="card">
      <div class="total"><span>${per(r.periode)}</span><span>${esc(jourTxt(r.date))}</span></div>
      <div class="total"><span>Gallons</span><span class="v">${nf(r.total_gallons,3)}</span></div>
      <div class="total"><span>Attendu</span><span class="v">${G(r.montant_attendu)}</span></div>
      <div class="total"><span>Compté</span><span class="v">${G(r.montant_compte)}</span></div>
      <div class="total"><span>Écart</span><span class="v">${signe(r.ecart)}</span></div></div>
    <button class="btn" onclick="deconnexion()">Me déconnecter</button>
    <div style="height:12px"></div>
    <button class="btn sec" onclick="nouveauRapport()">Faire un autre rapport</button>
    <h2>Mes derniers rapports</h2><div class="card" id="hist"></div></div>`;
  chargerHistorique();
}
function nouveauRapport(){
  const charte = S.charte; reinit(); S.charte = charte;
  S.etape = 'periode'; chargerContexte();
}

async function chargerHistorique(){
  try{
    const rs = await api('GET','/api/pompiste/rapports');
    const lib = {SOUMIS:'En vérification', PROBLEME:'Problème signalé', CONFIRME:'Validé', RESOLU:'Résolu', REJETE:'À refaire'};
    $('hist').innerHTML = rs.length ? rs.slice(0,8).map(r=>`<div class="hist">
      <div style="display:flex;justify-content:space-between;gap:8px"><b>${per(r.periode)} · ${new Date(r.date+'T12:00:00').toLocaleDateString('fr-FR')}</b>
        <span class="badge ${r.statut}">${lib[r.statut] || r.statut}</span></div>
      <div style="font-size:15px;color:var(--muted)">${esc([...new Set(r.lignes.map(l=>l.produit_nom))].join(', '))} · ${nf(r.total_gallons,3)} gal · écart ${signe(r.ecart)}</div>
      ${r.commentaire_superviseur ? `<div class="com"><b>${esc(r.traite_par_nom||'Direction')} :</b> ${esc(r.commentaire_superviseur)}</div>` : ''}
      ${r.statut==='REJETE' ? '<div style="font-size:15px;margin-top:6px;font-weight:700">Refaites ce rapport après correction.</div>' : ''}
    </div>`).join('') : '<span class="sub">Aucun rapport pour l\'instant.</span>';
  }catch(e){ const h = $('hist'); if(h) h.innerHTML = ''; }
}

demarrer();
</script>
</body>
</html>
