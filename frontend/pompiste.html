<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Espace pompiste</title>
<style>
:root{
  --bg:#eef2f7; --panel:#fff; --text:#0f172a; --muted:#64748b; --border:#d7dee8;
  --accent:#ea580c; --accent-2:#c2410c; --accent-soft:#fff1e8; --ok:#16a34a; --ok-soft:#e7f6ec;
  --err:#dc2626; --err-soft:#fdecec; --warn:#b45309; --warn-soft:#fff5dc;
  --gaz:#16a34a; --gaz-soft:#e7f6ec; --die:#2563eb; --die-soft:#e8effd;
  --touche:#f6f8fb; --ombre:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.06);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1220; --panel:#121b2f; --text:#e5e9f2; --muted:#94a3b8; --border:#26334f;
    --accent:#fb923c; --accent-2:#f97316; --accent-soft:#2a1c10; --ok:#4ade80; --ok-soft:#0f2619;
    --err:#f87171; --err-soft:#2c1414; --warn:#fbbf24; --warn-soft:#2a2210;
    --gaz:#4ade80; --gaz-soft:#0f2619; --die:#60a5fa; --die-soft:#101d33; --touche:#18233b;
    --ombre:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Tablettes Android : pas d'agrandissement automatique du texte ; jamais de défilement horizontal */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:clip}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
.env{background:#b91c1c;color:#fff;text-align:center;font-size:13px;font-weight:700;letter-spacing:.08em;padding:5px}
header{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--panel);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
header .marque{font-weight:900;font-size:20px;letter-spacing:.03em}
.langues{margin-left:auto;display:flex;background:var(--bg);border:2px solid var(--border);border-radius:14px;padding:3px;gap:3px}
.langues button{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;
  background:transparent;color:var(--muted)}
.langues button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
header .qui{text-align:right;line-height:1.2}
header .qui b{display:block;font-size:17px}
header .qui span{font-size:14px;color:var(--muted);font-family:var(--mono)}
main{max-width:1060px;margin:0 auto;padding:22px 24px 150px}
h1{font-size:32px;line-height:1.15;margin:4px 0 6px;letter-spacing:-.01em}
h2{font-size:20px;margin:26px 0 10px}
p.sub{color:var(--muted);margin:0 0 20px;font-size:18px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:var(--ombre)}
label{display:block;font-size:15px;font-weight:700;color:var(--muted);margin:12px 0 6px}
input,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);
  border:2px solid var(--border);border-radius:14px;padding:14px 16px}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
.btn{font:inherit;font-weight:800;border:0;border-radius:16px;padding:16px 22px;cursor:pointer;
  background:var(--accent);color:#fff;width:100%;min-height:64px;font-size:20px}
.btn:active{background:var(--accent-2)}
.btn:disabled{opacity:.35;cursor:default}
.btn.attention{background:var(--warn)}
.btn.sec{background:var(--panel);color:var(--text);border:2px solid var(--border)}
.btn.petit{width:auto;min-height:0;padding:10px 18px;font-size:16px;border-radius:12px}
.lien{background:none;border:0;color:var(--muted);font:inherit;font-size:17px;text-decoration:underline;
  cursor:pointer;padding:14px 0;display:block;margin:8px auto 0}

/* Fil */
.fil{display:flex;align-items:center;gap:12px;margin:0 0 16px;min-height:52px}
.fil .retour{font:inherit;font-weight:800;font-size:17px;background:var(--panel);border:2px solid var(--border);
  color:var(--text);border-radius:14px;padding:11px 20px;cursor:pointer}
.fil .pas{margin-left:auto;font-size:15px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.resume{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.resume span{font-size:15px;font-weight:800;background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:6px 14px}

/* Gros boutons de choix */
.choix{display:grid;gap:16px}
@media (min-width:700px){ .choix.deux{grid-template-columns:1fr 1fr} .choix.trois{grid-template-columns:repeat(2,1fr)} }
@media (min-width:980px){ .choix.trois{grid-template-columns:repeat(3,1fr)} }
.gros{display:flex;align-items:center;gap:18px;width:100%;min-height:110px;padding:20px 22px;cursor:pointer;
  font:inherit;font-size:26px;font-weight:900;text-align:left;color:var(--text);
  background:var(--panel);border:3px solid var(--border);border-radius:24px;box-shadow:var(--ombre)}
.gros:active{transform:scale(.985)}
.gros .ico{flex:none;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:34px;background:var(--bg)}
.gros small{display:block;font-size:16px;font-weight:600;color:var(--muted);margin-top:3px}
.gros.gaz .ico{background:var(--gaz-soft);color:var(--gaz)}
.gros.die .ico{background:var(--die-soft);color:var(--die)}
.gros.on{border-color:var(--accent);background:var(--accent-soft)}
.gros.on .coche{background:var(--accent);border-color:var(--accent);color:#fff}
.gros .coche{margin-left:auto;flex:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--border);
  display:grid;place-items:center;font-size:24px;color:transparent}
.gros:disabled{opacity:.45;cursor:default}
.gros.erreur{border-color:var(--err)}
.gros.grand{min-height:150px;font-size:32px}
.gros.grand .ico{width:80px;height:80px;font-size:44px}

/* Deux colonnes : informations | clavier */
.deux-col{display:grid;gap:20px}
@media (min-width:820px){ .deux-col{grid-template-columns:1fr 380px;align-items:start} .deux-col .cote{position:sticky;top:96px} }
.pompe-titre{font-size:38px;font-weight:900;margin:0}
.champ{background:var(--panel);border:3px solid var(--border);border-radius:20px;padding:16px 20px;margin:14px 0;cursor:pointer}
.champ.actif{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.champ.fixe{cursor:default;background:var(--bg)}
.champ .lib{font-size:16px;font-weight:800;color:var(--muted)}
.champ .val{font-family:var(--mono);font-size:44px;font-weight:800;min-height:58px;letter-spacing:.02em}
.champ .val.vide{color:var(--border)}
.champ .src{font-size:14px;color:var(--muted);margin-top:2px}
.curseur{display:inline-block;width:3px;height:42px;background:var(--accent);vertical-align:-6px;margin-left:2px;animation:clig 1s steps(1) infinite}
@keyframes clig{50%{opacity:0}}
.calcul{display:flex;justify-content:space-between;font-family:var(--mono);font-size:22px;font-weight:800;
  background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px 20px}
.msg-err{color:var(--err);font-weight:800;margin-top:10px;font-size:18px}

/* Clavier numérique */
.pave{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:var(--panel);border:1px solid var(--border);
  border-radius:24px;padding:14px;box-shadow:var(--ombre)}
.touche{font:inherit;font-size:34px;font-weight:800;font-family:var(--mono);height:82px;border-radius:18px;cursor:pointer;
  border:2px solid var(--border);background:var(--touche);color:var(--text)}
.touche:active{background:var(--accent-soft);border-color:var(--accent)}
.touche.eff{font-size:28px;color:var(--err)}
.pave .vide{visibility:hidden}

/* Billetterie */
.billets{display:grid;gap:10px}
.billet{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}
.billet .coup{font-size:24px;font-weight:900;white-space:nowrap}
.billet .coup small{display:block;font-size:14px;font-weight:700;color:var(--muted);font-family:var(--mono)}
.case-n{background:var(--panel);border:3px solid var(--border);border-radius:16px;padding:8px 12px;cursor:pointer;text-align:center}
.case-n .lib{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.case-n .val{font-family:var(--mono);font-size:34px;font-weight:800;min-height:46px}
.case-n.actif{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.case-n.zero .val{color:var(--border)}
.entete-billets{display:grid;grid-template-columns:150px 1fr;gap:12px;font-size:14px;font-weight:800;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em;padding:0 0 2px}
.entete-billets span{text-align:center}
.entete-billets span:first-child{text-align:left}

/* Tableaux / récap */
table{width:100%;border-collapse:collapse}
th,td{padding:12px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{font-size:14px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right;white-space:nowrap}
.num{font-family:var(--mono)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;font-weight:800;font-size:19px}
.total .v{font-family:var(--mono);font-size:24px}
.ecart{border-radius:18px;padding:18px 20px;font-weight:900;font-size:22px;display:flex;justify-content:space-between;margin-top:6px}
.ecart{gap:10px;align-items:center} .ecart span:last-child{white-space:nowrap}
.ecart.ok{background:var(--ok-soft);color:var(--ok)}
.ecart.neg{background:var(--err-soft);color:var(--err)}
.ecart.pos{background:var(--warn-soft);color:var(--warn)}
.alerte{border-radius:18px;padding:16px 20px;margin-bottom:16px;font-weight:800}
.alerte.err{background:var(--err-soft);color:var(--err)}
.alerte.ok{background:var(--ok-soft);color:var(--ok)}
.alerte.warn{background:var(--warn-soft);color:var(--warn)}
.charte li{margin-bottom:14px;font-size:19px}
.case{display:flex;gap:14px;align-items:center;margin:18px 0 4px;font-weight:900;font-size:22px;
  background:var(--accent-soft);border:3px solid var(--accent);border-radius:18px;padding:18px;cursor:pointer}
.case input{width:36px;height:36px;flex:none;margin:0;accent-color:var(--accent)}
.badge{display:inline-block;font-size:14px;font-weight:800;border-radius:20px;padding:3px 12px}
.badge.SOUMIS{background:var(--warn-soft);color:var(--warn)}
.badge.PROBLEME{background:var(--err-soft);color:var(--err)}
.badge.CONFIRME,.badge.RESOLU{background:var(--ok-soft);color:var(--ok)}
.badge.REJETE{background:var(--err-soft);color:var(--err)}
.hist{border-bottom:1px solid var(--border);padding:12px 0}
.hist:last-child{border:0}
.com{margin-top:8px;font-size:16px;background:var(--bg);border-radius:12px;padding:10px 12px}
.section-tete{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.section-tete h2{margin:0}
.produit-tete{font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin:8px 0 2px}
.btn-mod{font:inherit;font-weight:800;font-size:16px;border-radius:12px;padding:10px 16px;cursor:pointer;
  background:var(--accent-soft);color:var(--accent-2);border:2px solid var(--accent)}
.retirer{flex:none;width:48px;height:48px;border-radius:14px;border:2px solid var(--border);background:transparent;
  color:var(--muted);font-size:18px;cursor:pointer}
.barre-bas{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--border);
  padding:14px 24px calc(14px + env(safe-area-inset-bottom));z-index:6;box-shadow:0 -4px 18px rgba(15,23,42,.06)}
.barre-bas .in{max-width:1060px;margin:0 auto;display:flex;gap:16px;align-items:center}
.barre-bas .info{flex:1;font-size:16px;color:var(--muted)}
.barre-bas .info b{display:block;color:var(--text);font-family:var(--mono);font-size:24px}
.barre-bas .btn{width:auto;flex:none;min-width:260px}
.cache{display:none!important}
.connexion{max-width:520px;margin:5vh auto 0}

/* Billetterie au clavier de l'appareil */
.billets-card{max-width:640px}
.billets-card .billet{padding:4px 0;border-radius:14px;cursor:text}
.saisie-n{font-family:var(--mono);font-size:30px;font-weight:800;text-align:center;padding:10px 12px;border-width:3px;
  background:var(--panel);min-width:0}
.saisie-n::placeholder{color:var(--border)}
.billet.actif .coup{color:var(--accent-2)}
@media (max-width:480px){ .saisie-n{font-size:24px;padding:8px 10px} }

/* Date du rapport et calendrier */
.date-rapport{display:flex;align-items:center;gap:14px;width:100%;margin:0 0 16px;padding:14px 18px;cursor:pointer;
  font:inherit;font-size:20px;font-weight:800;text-align:left;color:var(--text);
  background:var(--panel);border:3px solid var(--border);border-radius:20px;box-shadow:var(--ombre)}
.date-rapport .ico{font-size:28px}
.date-rapport small{display:block;font-size:14px;font-weight:700;color:var(--muted)}
.date-rapport .chg{margin-left:auto;flex:none;font-size:16px;color:var(--accent-2);background:var(--accent-soft);
  border:2px solid var(--accent);border-radius:12px;padding:8px 14px}
.calendrier{padding:16px;max-width:600px}
.cal-tete{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:20px}
.cal-nav{font:inherit;font-size:28px;font-weight:800;width:56px;height:52px;border-radius:14px;cursor:pointer;
  border:2px solid var(--border);background:var(--touche);color:var(--text)}
.cal-nav:disabled{opacity:.3;cursor:default}
.cal-grille{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal-js{text-align:center;font-size:14px;font-weight:800;color:var(--muted);padding:4px 0}
.jour{font:inherit;font-family:var(--mono);font-size:22px;font-weight:800;aspect-ratio:1;min-height:44px;border-radius:14px;cursor:pointer;
  border:2px solid var(--border);background:var(--touche);color:var(--text)}
.jour.auj{border-color:var(--accent)}
.jour.on{background:var(--accent);border-color:var(--accent);color:#fff}
.jour:disabled{opacity:.25;cursor:default}
@media (max-width:480px){ .cal-grille{gap:5px} .jour{font-size:18px;border-radius:10px} .date-rapport{font-size:17px;padding:12px 14px}
  .date-rapport .chg{padding:6px 10px;font-size:14px} }

/* Fiche imprimée (terminal à imprimante thermique) */
#ticket{display:none}
.papier{display:flex;gap:6px;justify-content:center;margin:10px 0 0}
.papier button{font:inherit;font-weight:700;font-size:15px;border-radius:10px;padding:8px 14px;cursor:pointer;
  border:2px solid var(--border);background:var(--panel);color:var(--muted)}
.papier button.on{border-color:var(--accent);color:var(--text)}
.btn-print{background:var(--text);color:var(--bg)}
@media print{
  body{background:#fff!important}
  body > *:not(#ticket){display:none!important}
  #ticket{display:block!important;color:#000;background:#fff;font:12px/1.35 "Courier New",ui-monospace,monospace;margin:0;padding:0}
  #ticket.l58{width:48mm;font-size:11px} #ticket.l80{width:72mm}
  #ticket .i,#ticket .b{overflow-wrap:anywhere}
  #ticket .c{text-align:center} #ticket .b{font-weight:700}
  #ticket .gr{font-size:15px;font-weight:700}
  #ticket .sep{border-top:1px dashed #000;margin:5px 0}
  #ticket .sep2{border-top:2px solid #000;margin:5px 0}
  #ticket .l{display:flex;justify-content:space-between;gap:6px}
  #ticket .l span:last-child{text-align:right;white-space:nowrap}
  #ticket .pompe{margin:3px 0}
  #ticket .sig{margin-top:18px;border-top:1px solid #000;padding-top:2px;text-align:center;font-size:10px}
}
.langues .court{display:none}

/* Lignes de pompe (vérification, rapport, résumé) */
.lp{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.lp:last-of-type{border-bottom:0}
.lp-nom{flex:1 1 auto;min-width:0}
.lp-nom b{display:block;font-size:19px}
.lp-idx{display:block;font-size:15px;color:var(--muted);overflow-wrap:anywhere}
.lp-val{text-align:right;white-space:nowrap}
.lp-val b{display:block;font-size:18px}
.lp-val span{font-size:15px;color:var(--muted)}
.lp-act{flex:none}
.billets-resume td{white-space:nowrap}
/* Rien ne doit élargir la page au-delà de l'écran */
main,.card,.deux-col > *{min-width:0}
.sub,h1,h2{overflow-wrap:anywhere}
/* ── Une seule colonne (sous 820 px) : l'écran d'index doit tenir
      au-dessus de la barre du bas, clavier compris ── */
@media (max-width:819px){
  .astuce{display:none}
  .deux-col{gap:10px}
  .deux-col .calcul{display:none}           /* gallons et total : déjà dans la barre du bas */
  .champ{margin:8px 0;padding:10px 16px;border-radius:16px}
  .champ .lib{font-size:14px}
  .champ .val{font-size:32px;min-height:42px}
  .pompe-titre{font-size:28px}
  .pave{gap:8px;padding:10px;border-radius:18px}
  .touche{height:56px;font-size:28px;border-radius:14px}
}
/* ── Tablettes étroites et téléphones ── */
@media (max-width:720px){
  html,body{font-size:17px}
  main{padding:16px 14px 130px}
  header{padding:10px 14px;flex-wrap:wrap;row-gap:8px}
  h1{font-size:26px} .pompe-titre{font-size:30px} .champ .val{font-size:38px}
  .gros{min-height:96px;font-size:23px;padding:16px 18px;gap:14px}
  .gros.grand{min-height:120px;font-size:27px}
  .gros .ico{width:54px;height:54px;font-size:28px}
  .gros.grand .ico{width:64px;height:64px;font-size:34px}
  .touche{height:66px;font-size:30px}
  .barre-bas{padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
  .barre-bas .in{gap:10px}
  .barre-bas .info{min-width:0}
  .barre-bas .info b{font-size:20px;overflow-wrap:anywhere}
  .barre-bas .btn{min-width:0;flex:0 1 auto;font-size:18px;padding:14px 16px;min-height:56px}
  .fil .pas{font-size:13px;text-align:right}
  .fil .retour{padding:9px 14px;font-size:16px}
  .billet,.entete-billets{grid-template-columns:118px 1fr}
  .billet .coup{font-size:20px}
  .case-n .val{font-size:28px}
  .total{font-size:17px} .total .v{font-size:21px}
  .ecart{font-size:19px;padding:14px 16px}
  .lp-nom b{font-size:18px}
}
@media (max-width:480px){
  header{flex-wrap:nowrap;padding:8px 12px}
  header .marque{flex:1;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .qui{display:none}
  .langues{margin-left:0}
  .langues .long{display:none} .langues .court{display:inline}
  .langues button{padding:6px 10px;font-size:14px}
  header #btn-sortir{padding:8px 12px;font-size:15px}
  h1{font-size:24px} p.sub{font-size:16px;margin-bottom:14px}
  .fil{min-height:44px;margin-bottom:8px} .resume{margin-bottom:8px}
  .card{padding:16px;border-radius:16px}
  .lp{flex-wrap:wrap;gap:6px 12px}
  .lp-act{width:100%;text-align:right}
  .barre-bas .btn{font-size:16px;padding:12px 14px}
  .billet,.entete-billets{grid-template-columns:96px 1fr}
  .billet .coup{font-size:18px}
  .case-n{padding:4px 10px} .case-n .val{font-size:26px;min-height:36px}
  .gros{font-size:21px}
  .gros.grand{font-size:24px;min-height:104px}
  /* Écran d'index : tout visible au-dessus de la barre du bas */
  .astuce{display:none}
  .pompe-titre{font-size:26px}
  .champ{margin:8px 0;padding:10px 14px;border-radius:16px}
  .champ .lib{font-size:14px}
  .champ .val{font-size:30px;min-height:40px}
  .deux-col{gap:10px}
  .deux-col .calcul{display:none}           /* gallons et total : déjà dans la barre du bas */
  .pave{gap:8px;padding:10px;border-radius:18px}
  .touche{height:54px;font-size:26px;border-radius:14px}
}
@media (max-width:380px){

  if(v) for(const [a,b] of Object.entries(v)) s = s.replace('{' + a + '}', b); return s; }
function choisirLangue(l){ LANG = l; try{ localStorage.setItem('pompiste-lang', l); }catch(e){}
  document.documentElement.lang = l === 'ht' ? 'ht' : 'fr'; majEntete(); }

  Object.assign(S, {ctx:null, etape:'charte', charte:false, date:null, periode:null, produitId:null,
    choisies:[], pos:0, index:{}, billets:{}, monnaie:'', note:'', erreurs:{}, dernier:null,
    champ:null, modif:null, depuisResume:false, champActif:null, caseActive:null, dernierProduit:null});
}
reinit();

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const nf = (n,d=0) => Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const G = n => nf(n) + ' G';
const signe = n => (n > 0 ? '+' : '') + G(n);
const per = p => t(p);
const num = v => { if(v == null || String(v).trim() === '') return null;
  const x = parseFloat(String(v).replace(',', '.').replace(/\s/g,'')); return isNaN(x) ? null : x; };
const ent = v => { const x = parseInt(v,10); return isNaN(x) || x < 0 ? 0 : x; };
function jourTxt(iso){ const d = new Date(iso + 'T12:00:00');
  return `${t('jours')[d.getDay()]} ${d.getDate()} ${t('mois')[d.getMonth()]}`; }
const jourCourt = iso => { const d = new Date(iso + 'T12:00:00'); return `${d.getDate()} ${t('mois')[d.getMonth()].slice(0, 3)}`; };
const hier = iso => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate()-1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

async function api(method, url, body){
  const r = await fetch(url, {method, credentials:'include',
    headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined});
  let d = null; try{ d = await r.json(); }catch(e){}
  if(!r.ok){ const e = new Error(typeof d?.detail === 'string' ? d.detail : (d?.detail?.message || 'Erreur ' + r.status));
    e.status = r.status; e.detail = d?.detail; e.code = d?.detail?.code; throw e; }
  return d;
}
// Message d'erreur dans la langue choisie (codes envoyés par le serveur)
function msgErreur(e){
  const c = e.code;
  if(c === 'deja_rapporte') return t('e_deja', {p: esc(e.detail.pompes || '')});
  if(c === 'terminer_dabord') return t('e_terminer');
  if(c === 'rien_a_terminer') return t('e_rien');
  if(c === 'date_future') return t('e_date_future');
  if(c === 'date_ancienne') return t('e_date_ancienne');
  return esc(e.message);
}
function msgLigne(x){
  const m = {negatif:'e_negatif', double:'e_double', inactive:'e_inactive', fin_inferieure:'e_fin_inferieure',
             debut_different:'debut_diff'}[x.code];
  if(x.code === 'anormal') return t('e_anormal', {g: nf(x.gallons)});
  return m ? t(m) : x.message;
}

// ── Clavier numérique à l'écran ─────────────────────────────────────
function pave(decimal){
  const k = ['1','2','3','4','5','6','7','8','9', decimal ? ',' : '', '0', '⌫'];
  return `<div class="pave">${k.map(x => x ? `<button class="touche ${x==='⌫'?'eff':''}" data-k="${x}">${x}</button>`
                                         : '<span class="vide"></span>').join('')}</div>`;
}
function taper(k){
  const c = S.champ; if(!c) return;
  let v = c.get() || '';
  if(k === '⌫') v = v.slice(0, -1);
  else if(k === ',' || k === '.'){ if(!c.decimal || v.includes('.')) return; v = (v || '0') + '.'; }
  else { if(v.replace('.','').length >= (c.max || 12)) return; if(v === '0') v = ''; v += k; }
  c.set(v);
  c.apres && c.apres();
}
document.addEventListener('click', e => { const b = e.target.closest('.touche'); if(b) taper(b.dataset.k); });
document.addEventListener('keydown', e => {          // clavier physique (tablette avec clavier, tests)
  if(!S.champ || e.target.matches('input,textarea')) return;
  if(/^[0-9]$/.test(e.key)) taper(e.key);
  else if(e.key === ',' || e.key === '.') taper('.');
  else if(e.key === 'Backspace') taper('⌫');
  else if(e.key === 'Enter'){ const b = $('barre-btn'); if(!$('barre').classList.contains('cache') && !b.disabled) b.click(); }
  else return;
  e.preventDefault();
});
const affiche = (v, actif) => (v ? esc(v.replace('.', ',')) : '') + (actif ? '<span class="curseur"></span>' : '');

function majEntete(){
  $('langues').innerHTML = ['ht','fr'].map(l => `<button class="${LANG===l?'on':''}" onclick="choisirLangue('${l}')">`
    + `<span class="long">${l==='ht'?'Kreyòl':'Français'}</span><span class="court">${l==='ht'?'HT':'FR'}</span></button>`).join('');
  $('btn-sortir').textContent = t('sortir');
  if(S.ctx || S.etape === 'fin') rendre(); else if($('f-login')) ecranConnexion();
}

// ── Démarrage / connexion ───────────────────────────────────────────
async function demarrer(){
  document.documentElement.lang = LANG;
  majEntete();
  try{
    const b = await api('GET','/api/config/branding');
    if(b?.nom) $('marque').textContent = b.nom;
    S.marque = b || {};
    if(b?.environnement && b.environnement !== 'production'){
      $('env').textContent = String(b.environnement).toUpperCase() + ' — environnement de test';
      $('env').classList.remove('cache');
    }
  }catch(e){}
  await chargerContexte();
}

async function chargerContexte(){
  try{
    const q = S.date && S.periode ? `?date=${S.date}&periode=${S.periode}` : '';
    S.ctx = await api('GET','/api/pompiste/contexte' + q);
    if(S.ctx.en_cours){
      S.date = S.ctx.date; S.periode = S.ctx.periode;
      if(S.charte && ['charte','periode'].includes(S.etape)) S.etape = 'rapport';
    }
    if(!S.date) S.date = S.ctx.aujourd_hui;
    $('qui').innerHTML = `<b>${esc(S.ctx.pompiste.nom)}</b><span>${esc(S.ctx.pompiste.username)}</span>`;
    $('qui').classList.remove('cache'); $('btn-sortir').classList.remove('cache');
    rendre();
  }catch(e){
    if(e.status === 401) return ecranConnexion();
    if(e.status === 403) return ecranPasPompiste();
    sansBarre();
    $('app').innerHTML = `<div class="alerte err">${msgErreur(e)}</div>
      <button class="btn" onclick="chargerContexte()">${t('reessayer')}</button>`;
  }
}

function ecranConnexion(msg){
  S.champ = null; S.ctx = null;
  $('barre').classList.add('cache'); $('qui').classList.add('cache'); $('btn-sortir').classList.add('cache');
  const u = $('l-user')?.value || '';
  $('app').innerHTML = `<div class="connexion">
    <h1>${t('espace')}</h1><p class="sub">${t('connexion_sub')}</p>
    <div class="choix deux" style="margin-bottom:16px">
      <button class="gros ${LANG==='ht'?'on':''}" onclick="choisirLangue('ht')"><span class="ico">🇭🇹</span><span>Kreyòl</span></button>
      <button class="gros ${LANG==='fr'?'on':''}" onclick="choisirLangue('fr')"><span class="ico">🇫🇷</span><span>Français</span></button>
    </div>
    ${msg ? `<div class="alerte err">${msg}</div>` : ''}
    <form class="card" id="f-login" autocomplete="on">
      <label for="l-user">${t('mon_code')}</label>
      <input id="l-user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required
        value="${esc(u)}" placeholder="ex. jeanpierre4821" style="font-family:var(--mono);font-size:24px">
      <label for="l-pin">${t('mon_pin')}</label>
      <input id="l-pin" type="password" inputmode="numeric" maxlength="9" autocomplete="current-password" required
        style="font-family:var(--mono);font-size:30px;letter-spacing:.3em;text-align:center">
      <div style="height:18px"></div>
      <button class="btn" id="l-btn">${t('se_connecter')}</button>

  $('f-login').onsubmit = async ev => {

/* La tablette était connectée avec un autre compte (administration…) :
   l'espace pompiste ne mène jamais vers le système principal — on ferme
   cette session et on affiche la connexion pompiste. */
async function ecranPasPompiste(){
  try{ await api('POST','/api/logout'); }catch(e){}
  reinit();
  ecranConnexion(t('autre_compte'));
}

async function deconnexion(){
  clearTimeout(_veille);
  try{ await api('POST','/api/logout'); }catch(e){}
  reinit();
  ecranConnexion();
}

// ── Navigation ──────────────────────────────────────────────────────
const enCours = () => S.ctx?.en_cours;
const produit = () => S.ctx.produits.find(p => p.id === S.produitId);
const pompeCtx = id => { for(const p of S.ctx.produits) for(const q of p.pompes) if(q.id === id) return q; return null; };
const libres = p => p.pompes.filter(q => !q.deja_rapportee);
const PHASE_ARGENT = ['billetterie','resume','modif'];

function aller(etape){ S.etape = etape; rendre(); }
function precedent(){
  const e = S.etape;
  if(e === 'index' && S.pos > 0){ S.pos--; S.champActif = null; return rendre(); }
  if(e === 'billetterie' && S.depuisResume) return aller('resume');
  const retour = {periode:'charte', calendrier:'periode', produit: enCours() ? 'rapport' : 'periode', pompes:'produit', index:'pompes',
                  compteurs:'index', billetterie:'rapport', resume:'billetterie', modif:'resume'}[e];
  if(e === 'compteurs'){ S.pos = S.choisies.length - 1; S.champActif = null; }
  aller(retour || 'charte');
}

function entete(titrePhase){
  const puces = [];
  if(S.periode && !['periode','charte','calendrier'].includes(S.etape))
    puces.push(per(S.periode) + (S.date === S.ctx.aujourd_hui ? '' : ` · ${jourCourt(S.date)}`));
  if(S.produitId && ['pompes','index','compteurs'].includes(S.etape)) puces.push(produit()?.nom || '');
  if(S.choisies.length && ['index','compteurs'].includes(S.etape)) puces.push(t('n_pompes', {n: S.choisies.length}));
  const phase = titrePhase ?? (PHASE_ARGENT.includes(S.etape) ? t('etape2') : t('etape1'));
  const avecRetour = !['charte','rapport'].includes(S.etape);
  return `<div class="fil">${avecRetour ? `<button class="retour" onclick="precedent()">${t('retour')}</button>` : ''}
      <span class="pas">${phase}</span></div>
    ${puces.length ? `<div class="resume">${puces.map(p=>`<span>${esc(p)}</span>`).join('')}</div>` : ''}`;
}

function barre(info, libelle, action, actif=true){
  $('barre').classList.remove('cache'); $('barre-btn').classList.remove('attention');
  $('barre-info').innerHTML = info;
  const b = $('barre-btn'); b.textContent = libelle; b.onclick = action; b.disabled = !actif;
}
const sansBarre = () => $('barre').classList.add('cache');

function rendre(){
  if(!S.ctx && S.etape !== 'fin') return;
  setTimeout(reveil, 0);
  if(!S.charte && S.etape !== 'fin') S.etape = 'charte';
  S.champ = null;
  ({charte:rCharte, periode:rPeriode, calendrier:rCalendrier, produit:rProduit, pompes:rPompes, index:rIndex, compteurs:rCompteurs,
    rapport:rRapport, billetterie:rBilletterie, resume:rResume, modif:rModif, fin:rFin})[S.etape]();
  window.scrollTo(0,0);
}

// ── 1. Période ──────────────────────────────────────────────────────
function rPeriode(){
  sansBarre();
  const auj = S.date === S.ctx.aujourd_hui, hi = S.date === hier(S.ctx.aujourd_hui);
  $('app').innerHTML = entete() + `
    <h1>${t('periode_q')}</h1>
    <button class="date-rapport" onclick="aller('calendrier')">
      <span class="ico">📅</span>
      <span><small>${t('date_rapport')}</small>${auj ? t('auj') + ', ' : (hi ? t('hier') + ', ' : '')}${esc(jourTxt(S.date))}</span>

      <button class="gros grand ${S.periode==='Apres-midi'?'on':''}" onclick="choisirPeriode('Apres-midi')">

    </div>`;
}

// Calendrier : un mois à la fois, gros jours à toucher ; jours futurs et trop
// anciens grisés (même règle que le serveur).
function rCalendrier(){
  sansBarre();
  const auj = S.ctx.aujourd_hui, min = S.ctx.date_min || hier(auj);
  if(!S.moisCal) S.moisCal = S.date.slice(0, 7);
  const [a, m] = S.moisCal.split('-').map(Number);
  const premier = new Date(a, m - 1, 1), nbJours = new Date(a, m, 0).getDate();
  const decal = (premier.getDay() + 6) % 7;                 // semaine du lundi au dimanche
  const iso = j => `${a}-${String(m).padStart(2,'0')}-${String(j).padStart(2,'0')}`;
  const cases = [];
  for(let i = 0; i < decal; i++) cases.push('<span></span>');
  for(let j = 1; j <= nbJours; j++){
    const d = iso(j), ok = d <= auj && d >= min;
    cases.push(`<button class="jour ${d===S.date?'on':''} ${d===auj?'auj':''}" ${ok ? `onclick="choisirDate('${d}')"` : 'disabled'}>${j}</button>`);
  }
  const moisPrec = new Date(a, m - 2, 1), moisSuiv = new Date(a, m, 1);
  const cle = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  const precOk = cle(moisPrec) >= min.slice(0, 7), suivOk = cle(moisSuiv) <= auj.slice(0, 7);
  $('app').innerHTML = entete() + `
    <h1>${t('choisir_date')}</h1>
    <p class="sub">${t('date_regle', {n: S.ctx.date_min ? Math.round((new Date(auj) - new Date(min)) / 864e5) : 1})}</p>
    <div class="choix deux" style="margin-bottom:14px">
      <button class="gros ${S.date===auj?'on':''}" onclick="choisirDate('${auj}')"><span class="ico">📅</span><span>${t('auj')}<small>${esc(jourTxt(auj))}</small></span></button>
      <button class="gros ${S.date===hier(auj)?'on':''}" onclick="choisirDate('${hier(auj)}')"><span class="ico">↩</span><span>${t('hier')}<small>${esc(jourTxt(hier(auj)))}</small></span></button>
    </div>
    <div class="card calendrier">
      <div class="cal-tete">
        <button class="cal-nav" ${precOk ? `onclick="S.moisCal='${cle(moisPrec)}';rCalendrier()"` : 'disabled'} aria-label="‹">‹</button>
        <b>${t('mois')[m-1]} ${a}</b>
        <button class="cal-nav" ${suivOk ? `onclick="S.moisCal='${cle(moisSuiv)}';rCalendrier()"` : 'disabled'} aria-label="›">›</button>
      </div>
      <div class="cal-grille">${t('jours_courts').map(x => `<span class="cal-js">${x}</span>`).join('')}${cases.join('')}</div>
    </div>`;
}
function choisirDate(d){
  if(d !== S.date){ S.periode = null; S.produitId = null; S.choisies = []; S.index = {}; S.erreurs = {}; }
  S.date = d; S.moisCal = null; aller('periode');
}
async function choisirPeriode(p){
  if(p !== S.periode){ S.produitId = null; S.choisies = []; S.index = {}; S.erreurs = {}; }
  S.periode = p; S.etape = 'produit';
  await chargerContexte();
}

// ── 2. Carburant ────────────────────────────────────────────────────
const clsProduit = n => /diesel|dyez/i.test(n) ? 'die' : (/gaz|essence/i.test(n) ? 'gaz' : '');
function rProduit(){

// ── 3. Pompes ───────────────────────────────────────────────────────
function rPompes(){
  const p = produit();
  if(!p) return aller('produit');
  S.choisies = S.choisies.filter(id => p.pompes.some(q => q.id === id && !q.deja_rapportee));
  const tout = libres(p).length && libres(p).every(q => S.choisies.includes(q.id));
  $('app').innerHTML = entete() + `
    <h1>${t('pompes_q')}</h1>
    <p class="sub">${t('pompes_sub')}</p>
    ${libres(p).length > 1 ? `<button class="gros ${tout?'on':''}" style="min-height:84px;margin-bottom:16px" onclick="toutesPompes()">
      <span class="ico">✓✓</span><span>${t('toutes')}<small>${t('n_pompes',{n:libres(p).length})}</small></span><span class="coche">✓</span></button>` : ''}
    <div class="choix trois">${p.pompes.map(q => {
      const on = S.choisies.includes(q.id), prise = q.deja_rapportee;
      return `<button class="gros ${on?'on':''} ${S.erreurs[q.id]?'erreur':''}" onclick="basculerPompe(${q.id})" ${prise?'disabled':''}>
        <span>${esc(q.nom)}<small>${prise ? (prise.moi ? t('deja_moi') : t('deja_par', {n: esc(prise.par)})) : t('a_saisir')}</small></span>
        <span class="coche">✓</span></button>`;
    }).join('')}</div>`;
  const n = S.choisies.length;
  barre(n ? `<b>${n}</b>${t('choisies', {n})}` : t('aucune'), t('continuer'),
        ()=>{ S.pos = 0; S.champActif = null; aller('index'); }, n > 0);
}
function basculerPompe(id){
  const p = produit();
  S.choisies = S.choisies.includes(id) ? S.choisies.filter(x => x !== id) : [...S.choisies, id];
  S.choisies.sort((a,b) => p.pompes.findIndex(q=>q.id===a) - p.pompes.findIndex(q=>q.id===b));
  rPompes();
}
function toutesPompes(){
  const ids = libres(produit()).map(q => q.id);
  S.choisies = ids.every(id => S.choisies.includes(id)) ? [] : ids;
  rPompes();
}

// ── 4. Les deux index — une pompe par écran, clavier à l'écran ──────
function valeurs(id){
  const s = S.index[id] || {};
  const av = num(s.avant), ap = num(s.apres);
  return {q: pompeCtx(id), s, av, ap, g: av != null && ap != null ? ap - av : null};
}

/* Écran d'index partagé par la saisie et la modification depuis le résumé. */
function ecranIndex(id, prix, titreHaut, fin){
  const s = (S.index[id] ||= {}), q = pompeCtx(id);
  if(!S.champActif || S.champActif.id !== id) S.champActif = {id, k: s.avant ? 'apres' : 'avant'};
  const dessin = () => {
    const k = S.champActif.k, v = valeurs(id);
    for(const c of ['avant','apres']){
      const el = $('z-' + c), val = s[c] || '';
      el.className = 'champ ' + (k === c ? 'actif' : '');
      el.innerHTML = `<div class="lib">${c === 'avant' ? t('idx_debut') : t('idx_fin')}</div>
        <div class="val ${val?'':'vide'}">${affiche(val, k === c) || '0'}</div>`;
    }
    const diff = S.erreurs[id]?.code === 'debut_different';
    $('i-diff').innerHTML = diff ? `<div class="alerte warn" style="margin:14px 0 0">⚠ ${t('debut_diff')}<br>
        <span style="font-weight:600">${t('debut_diff_action')}</span></div>`
      : (s.debutConfirme ? `<div class="alerte ok" style="margin:14px 0 0">✓ ${t('confirme_ok')}</div>` : '');
    const autreErr = S.erreurs[id] && !diff;
    $('i-err').innerHTML = autreErr ? `<div class="alerte err" style="margin-top:14px">${esc(msgLigne(S.erreurs[id]))}</div>` : '';
    const ok = v.av != null && v.ap != null && v.g >= 0 && !diff;
    $('i-calc').innerHTML = v.g == null ? ''
      : (v.g < 0 ? `<div class="msg-err">${t('fin_sup')}</div>`
                 : `<div class="calcul"><span>${nf(v.g,3)} gal</span><span>${G(v.g * prix)}</span></div>`);
    // Début à relire : le bouton de confirmation prend la place du bouton principal
    if(diff){
      barre(`<b>⚠</b>${t('debut_diff_action')}`, t('je_confirme'), () => confirmerDebut(id));
      $('barre-btn').classList.add('attention');
    } else { $('barre-btn').classList.remove('attention'); fin(ok, v); }
  };
  const choisir = k => {
    S.champActif.k = k;
    S.champ = {decimal:true, max:12, get:()=>s[k] || '',
               set:x=>{ s[k] = x; if(k === 'avant') s.debutConfirme = false; delete S.erreurs[id]; }, apres:dessin};
    dessin();
  };
  $('app').innerHTML = entete() + `<div class="deux-col"><div>
      ${titreHaut}
      <h1 class="pompe-titre">${esc(q.nom)}</h1>
      <p class="sub astuce" style="margin:4px 0 0">${t('toucher_case')}</p>
      <div id="i-err"></div><div id="i-diff"></div>
      <div id="z-avant"></div><div id="z-apres"></div><div id="i-calc"></div>
    </div><div class="cote">${pave(true)}</div></div>`;
  $('z-avant').onclick = () => choisir('avant');
  $('z-apres').onclick = () => choisir('apres');
  choisir(S.champActif.k);
}
function confirmerDebut(id){
  S.index[id].debutConfirme = true; delete S.erreurs[id]; rendre();
}

function rIndex(){
  const id = S.choisies[S.pos], dernier = S.pos === S.choisies.length - 1;
  ecranIndex(id, produit().prix_gallon, `<p class="sub" style="margin:0">${t('pompe_x', {i: S.pos+1, n: S.choisies.length})}</p>`,
    (ok, v) => barre(ok ? `<b>${nf(v.g,3)} gal</b>${t('vendus')}` : t('tapez_deux'), dernier ? t('verifier') : t('suivante'),
      ()=>{ S.champActif = null; if(dernier) aller('compteurs'); else { S.pos++; rendre(); } }, ok));
}

// Ligne de pompe des écrans de vérification : s'adapte à toutes les largeurs
// (nom + index à gauche, gallons + montant à droite, bouton à la fin ; sur un
// petit écran, le bouton passe en dessous au lieu de déborder).
function lignePompe(nom, av, ap, g, montant, action){
  return `<div class="lp"><div class="lp-nom"><b>${esc(nom)}</b>
      <span class="lp-idx num">${nf(av,3)} → ${nf(ap,3)}</span></div>
    <div class="lp-val num"><b>${nf(g,3)} gal</b><span>${G(montant)}</span></div>
    ${action ? `<div class="lp-act">${action}</div>` : ''}</div>`;
}

// ── 5. Vérification des compteurs de ce carburant ───────────────────
function lignes(){
  return S.choisies.map(id => { const v = valeurs(id); return {...v, montant: v.g * produit().prix_gallon}; });
}
function rCompteurs(){
  const l = lignes(), tot = l.reduce((a,x)=>a+x.montant,0), gal = l.reduce((a,x)=>a+x.g,0);
  $('app').innerHTML = entete() + `<h1>${t('verif_compteurs')}</h1>
    <p class="sub">${esc(produit().nom)} · ${per(S.periode)}, ${esc(jourTxt(S.date))}</p>
    <div class="card">
      ${l.map((x,i) => lignePompe(x.q.nom, x.av, x.ap, x.g, x.montant,
        `<button class="btn-mod" onclick="S.pos=${i};S.champActif=null;aller('index')">${t('modifier')}</button>`)).join('')}
    <div class="total"><span>${t('total')}</span><span class="v">${nf(gal,3)} gal</span></div>
    <div class="total" style="padding-top:0"><span>${t('montant')}</span><span class="v">${G(tot)}</span></div></div>
    <p class="sub">${t('argent_fin')}</p>`;
  barre(`<b>${G(tot)}</b>${esc(produit().nom)}`, t('envoyer_compteurs'), envoyerCompteurs);
}

async function envoyerCompteurs(){
  const b = $('barre-btn'); b.disabled = true; b.textContent = t('envoi');
  try{
    await api('POST','/api/pompiste/compteurs',{
      date:S.date, periode:S.periode, charte_acceptee:S.charte,
      lignes: lignes().map(x=>({pompe_id:x.q.id, metter_avant:x.av, metter_apres:x.ap, debut_confirme:!!x.s.debutConfirme}))});
    S.dernierProduit = produit()?.nom;
    S.produitId = null; S.choisies = []; S.index = {}; S.erreurs = {};
    S.etape = 'rapport';
    await chargerContexte();
  }catch(e){
    if(e.status === 422 && e.detail?.erreurs){
      S.erreurs = {}; for(const x of e.detail.erreurs) S.erreurs[x.pompe_id] = x;
      S.pos = Math.max(0, S.choisies.findIndex(id => S.erreurs[id])); S.etape = 'index'; S.champActif = null;
      await chargerContexte();
      return;
    }
    if(e.status === 401) return ecranConnexion(t('session'));
    b.disabled = false; b.textContent = t('envoyer_compteurs');
    $('app').insertAdjacentHTML('afterbegin', `<div class="alerte err">${msgErreur(e)}</div>`);
    window.scrollTo(0,0);
  }
}

// ── 6. « D'autres pompes ? » — oui (tel carburant) / non, j'ai fini ──
function lignesParProduit(r){
  const g = {}; for(const l of r.lignes) (g[l.produit_nom] ||= []).push(l); return g;
}
function rRapport(){
  const r = enCours();
  if(!r){ S.etape = 'periode'; return rPeriode(); }
  const restants = S.ctx.produits.filter(p => libres(p).length);
  sansBarre();
  $('app').innerHTML = entete(t('envoyes')) + `
    <h1>${t('autre_q')}</h1>
    <p class="sub">${S.dernierProduit ? t('autre_sub', {p: esc(S.dernierProduit)}) + ' · ' : ''}${per(r.periode)}, ${esc(jourTxt(r.date))}</p>
    <div class="deux-col"><div class="choix">
      ${restants.map(p => `<button class="gros ${clsProduit(p.nom)}" onclick="choisirProduit(${p.id})"><span class="ico">⛽</span>
        <span>${t('oui')}, ${esc(p.nom)}<small>${t('oui_sub', {p: esc(p.nom)})}</small></span></button>`).join('')}
      <button class="gros on" onclick="S.depuisResume=false;aller('billetterie')"><span class="ico">✔</span>
        <span>${t('non_fini')}<small>${t('non_fini_sub')}</small></span></button>
    </div>
    <div class="card"><h2 style="margin-top:0">${t('mon_rapport')}</h2>${Object.entries(lignesParProduit(r)).map(([nom, ls]) => `
      <div class="produit-tete">${esc(nom)}</div>
      ${ls.map(l => lignePompe(l.pompe_nom, l.metter_avant, l.metter_apres, l.gallons, l.montant,
          `<button class="retirer" onclick="retirerPompe(${l.pompe_id})" aria-label="✕">✕</button>`)).join('')}`).join('')}
      <div class="total"><span>${t('attendu')}</span><span class="v">${G(r.montant_attendu)}</span></div></div></div>`;
}
async function retirerPompe(id){
  const l = enCours().lignes.find(x => x.pompe_id === id);
  if(!confirm(t('retirer_q', {p: l.pompe_nom}))) return;
  try{ await api('DELETE', `/api/pompiste/compteurs/${id}`); }catch(e){ alert(e.message); }
  await chargerContexte();
}

// ── 7. Argent : nombre de billets par coupure + monnaie ─────────────
function totalCompte(){
  let s = 0;
  for(const c of S.ctx.coupures) s += c * ent(S.billets[c]);
  return s + (num(S.monnaie) || 0);
}
function rBilletterie(){
  if(!enCours()) return aller('periode');
  const c = S.ctx;
  // Saisie au clavier de l'appareil (touches du terminal ou clavier du système) :
  // de vraies cases de saisie, sans le clavier à l'écran. « Entrée » passe à la
  // case suivante ; après la monnaie, elle ouvre le résumé.
  $('app').innerHTML = entete() + `
    <h1>${t('compter')}</h1>
    <p class="sub">${t('compter_sub_clavier')}</p>
    <div class="card billets-card"><div class="entete-billets"><span>${t('billet')}</span><span>${t('nb_billets')}</span></div>
    <div class="billets">${c.coupures.map(k => `
      <label class="billet" for="in-${k}"><span class="coup">${nf(k)} G<small id="st-${k}"></small></span>
        <input class="saisie-n" id="in-${k}" data-c="${k}" type="text" inputmode="numeric" pattern="[0-9]*"
          autocomplete="off" enterkeyhint="next" maxlength="5" placeholder="0" value="${esc(S.billets[k] || '')}"></label>`).join('')}
      <label class="billet" for="in-monnaie"><span class="coup">${t('monnaie')}<small>${t('monnaie_sub')}</small></span>
        <input class="saisie-n" id="in-monnaie" data-c="monnaie" type="text" inputmode="decimal"
          autocomplete="off" enterkeyhint="done" maxlength="10" placeholder="0" value="${esc((S.monnaie || '').replace('.', ','))}"></label>
    </div>
    <div class="total" style="margin-top:10px"><span>${t('total')}</span><span class="v" id="b-total"></span></div></div>`;
  const champs = [...document.querySelectorAll('.saisie-n')];
  const maj = () => {
    for(const k of c.coupures){ const n = ent(S.billets[k]); $('st-' + k).textContent = n ? G(n * k) : ''; }
    $('b-total').textContent = G(totalCompte());
    $('barre-info').innerHTML = `${t('total_compte')}<b>${G(totalCompte())}</b>`;
  };
  champs.forEach((el, i) => {
    el.addEventListener('input', () => {
      if(el.dataset.c === 'monnaie'){
        let v = el.value.replace(',', '.').replace(/[^0-9.]/g, '');
        const p = v.indexOf('.'); if(p >= 0) v = v.slice(0, p + 1) + v.slice(p + 1).replace(/\./g, '').slice(0, 2);
        const vu = v.replace('.', ',');           // affichage à la française, valeur enregistrée avec un point
        if(vu !== el.value) el.value = vu;
        S.monnaie = v;
      } else {
        const v = el.value.replace(/\D/g, '');
        if(v !== el.value) el.value = v;
        S.billets[Number(el.dataset.c)] = v;
      }
      maj();
    });
    el.addEventListener('focus', () => { el.select(); el.closest('.billet').classList.add('actif'); });
    el.addEventListener('blur', () => el.closest('.billet').classList.remove('actif'));
    el.addEventListener('keydown', e => {
      if(e.key !== 'Enter') return;
      e.preventDefault();
      if(i < champs.length - 1) champs[i + 1].focus();
      else { el.blur(); $('barre-btn').click(); }
    });
  });
  barre(`${t('total_compte')}<b>${G(totalCompte())}</b>`, t('voir_resume'), () => aller('resume'));
  maj();
  champs[0].focus();
}

// ── 8. Résumé complet avant l'envoi, tout est modifiable ────────────
function rResume(){
  const r = enCours(), att = r.montant_attendu, cpt = totalCompte(), ec = cpt - att;
  const cls = Math.abs(ec) < 1 ? 'ok' : (ec < 0 ? 'neg' : 'pos');
  const txt = Math.abs(ec) < 1 ? t('juste') : (ec < 0 ? t('manque') : t('plus'));
  const billets = S.ctx.coupures.map(c => ({c, n: ent(S.billets[c])})).filter(x => x.n);
  $('app').innerHTML = entete() + `<h1>${t('resume')}</h1>
    <p class="sub">${per(r.periode)}, ${esc(jourTxt(r.date))}. ${t('resume_sub')}</p>
    <div class="card"><div class="section-tete"><h2>${t('mes_compteurs')}</h2></div>
      ${Object.entries(lignesParProduit(r)).map(([nom, ls]) => `<div class="produit-tete">${esc(nom)}</div>
        ${ls.map(l => lignePompe(l.pompe_nom, l.metter_avant, l.metter_apres, l.gallons, l.montant,
          `<button class="btn-mod" onclick="modifierPompe(${l.pompe_id})">${t('modifier')}</button>`)).join('')}`).join('')}
      <div class="total"><span>${t('attendu')}</span><span class="v">${G(att)}</span></div></div>
    <div class="card"><div class="section-tete"><h2>${t('mon_argent')}</h2>
        <button class="btn-mod" onclick="S.depuisResume=true;aller('billetterie')">${t('modifier')}</button></div>
      ${billets.length || num(S.monnaie) ? `<table class="billets-resume"><tbody>
        ${billets.map(x => `<tr><td><b>${nf(x.c)} G</b></td><td class="r num">× ${x.n}</td><td class="r num"><b>${G(x.n * x.c)}</b></td></tr>`).join('')}
        ${num(S.monnaie) ? `<tr><td><b>${t('monnaie')}</b></td><td></td><td class="r num"><b>${G(num(S.monnaie))}</b></td></tr>` : ''}
      </tbody></table>` : `<p class="sub" style="margin:0">${t('aucun_argent')}</p>`}
      <div class="total"><span>${t('argent_compte')}</span><span class="v">${G(cpt)}</span></div></div>
    <div class="card">
      <div class="ecart ${cls}"><span>${txt}</span><span>${signe(ec)}</span></div>
      <label for="r-note">${t('un_mot')}</label>
      <textarea id="r-note" rows="3" maxlength="500" placeholder="${esc(t('un_mot_ph'))}">${esc(S.note)}</textarea></div>`;
  $('r-note').oninput = e => S.note = e.target.value;
  barre(`${t('ecart')}<b>${signe(ec)}</b>`, t('envoyer_rapport'), terminer);
}

function modifierPompe(id){
  const l = enCours().lignes.find(x => x.pompe_id === id);
  S.modif = id; S.champActif = null; delete S.erreurs[id];
  S.index[id] = {avant: String(l.metter_avant), apres: String(l.metter_apres), debutConfirme: false};
  aller('modif');
}
function rModif(){
  const id = S.modif, l = enCours().lignes.find(x => x.pompe_id === id);
  ecranIndex(id, l.prix_gallon, `<p class="sub" style="margin:0">${t('modifier_x', {p: esc(l.produit_nom)})}</p>`,
    (ok, v) => barre(ok ? `<b>${nf(v.g,3)} gal</b>${t('vendus')}` : '', t('enregistrer'), async () => {
      try{
        await api('PUT', `/api/pompiste/compteurs/${id}`, {metter_avant:v.av, metter_apres:v.ap, debut_confirme:!!v.s.debutConfirme});
        S.modif = null; S.champActif = null; S.etape = 'resume';
        await chargerContexte();
      }catch(e){
        S.erreurs[id] = e.detail?.erreurs?.[0] || {message: e.message}; rendre();
      }
    }, ok));
}

async function terminer(){
  const b = $('barre-btn'); b.disabled = true; b.textContent = t('envoi');
  try{
    S.dernier = await api('POST','/api/pompiste/terminer',{
      billetterie: S.ctx.coupures.map(c => ({coupure:c, liasses:0, billets:ent(S.billets[c])})).filter(x => x.billets),
      monnaie: num(S.monnaie) || 0, note: S.note || null});
    aller('fin');
  }catch(e){
    if(e.status === 401) return ecranConnexion(t('session'));
    b.disabled = false; b.textContent = t('envoyer_rapport');
    $('app').insertAdjacentHTML('afterbegin', `<div class="alerte err">${msgErreur(e)}</div>`);
    window.scrollTo(0,0);
  }
}

// ── Envoyé ──────────────────────────────────────────────────────────
function rFin(){
  const r = S.dernier;
  sansBarre();
  $('app').innerHTML = `<div style="max-width:640px;margin:0 auto">
    <div style="text-align:center;font-size:80px;margin-top:10px">✅</div>
    <h1 style="text-align:center">${t('envoye')}</h1>
    <p class="sub" style="text-align:center">${t('prevenue')}</p>
    <div class="card">
      <div class="total"><span>${per(r.periode)}</span><span>${esc(jourTxt(r.date))}</span></div>
      <div class="total"><span>${t('gallons')}</span><span class="v">${nf(r.total_gallons,3)}</span></div>
      <div class="total"><span>${t('attendu')}</span><span class="v">${G(r.montant_attendu)}</span></div>
      <div class="total"><span>${t('compte')}</span><span class="v">${G(r.montant_compte)}</span></div>
      <div class="total"><span>${t('ecart')}</span><span class="v">${signe(r.ecart)}</span></div></div>
    <button class="btn btn-print" onclick="imprimerTicket(S.dernier)">🖨 ${t('imprimer')}</button>
    <div class="papier">${t('papier')} : ${['58','80'].map(l => `<button data-l="${l}" class="${PAPIER===l?'on':''}" onclick="choisirPapier('${l}')">${l} mm</button>`).join('')}</div>
    <div style="height:12px"></div>
    <button class="btn" onclick="deconnexion()">${t('deconnecter')}</button>
    <div style="height:12px"></div>
    <button class="btn sec" onclick="nouveauRapport()">${t('autre_rapport')}</button>
    <h2>${t('derniers')}</h2><div class="card" id="hist"></div></div>`;
  chargerHistorique();
  // Fiche imprimée automatiquement dès la soumission
  if(!r._imprime){ r._imprime = true; setTimeout(() => imprimerTicket(r), 400); }
}
// ── Fiche du rapport, format ticket (imprimante thermique du terminal) ──
let PAPIER = (() => { try{ return localStorage.getItem('pompiste-papier') || '58'; }catch(e){ return '58'; } })();
function choisirPapier(l){ PAPIER = l; try{ localStorage.setItem('pompiste-papier', l); }catch(e){}
  document.querySelectorAll('.papier button').forEach(b => b.classList.toggle('on', b.dataset.l === l)); }

function ticketHtml(r){
  const m = S.marque || {}, L = (a, b) => `<div class="l"><span>${a}</span><span>${b}</span></div>`;
  const pomp = S.ctx?.pompiste || {};
  const parProduit = {};
  for(const l of r.lignes) (parProduit[l.produit_nom] ||= []).push(l);
  const quand = d => { const x = new Date(d); return `${String(x.getDate()).padStart(2,'0')}/${String(x.getMonth()+1).padStart(2,'0')}/${x.getFullYear()} `
    + `${String(x.getHours()).padStart(2,'0')}:${String(x.getMinutes()).padStart(2,'0')}`; };
  const billets = (r.billetterie || []).map(b => ({c: b.coupure, n: (b.liasses||0) * 100 + (b.billets||0)})).filter(x => x.n);
  return `<div class="c gr">${esc(m.nom || 'KONEKTA')}</div>
    ${m.raison_sociale || m.complexe ? `<div class="c">${esc([m.raison_sociale, m.complexe].filter(Boolean).join(' · '))}</div>` : ''}
    ${m.adresse ? `<div class="c">${esc(m.adresse)}</div>` : ''}
    ${m.telephone1 ? `<div class="c">${esc(m.telephone1)}</div>` : ''}
    <div class="sep2"></div>
    <div class="c b">${t('tk_titre')}</div>
    <div class="c">${t('tk_no')} ${r.id}</div>
    <div class="sep"></div>
    <div class="b">${t('tk_pompiste')} : ${esc(r.pompiste_nom || pomp.nom || '')}</div>
    <div class="i">${t('tk_code')} : ${esc(pomp.username || '')}</div>
    <div class="i">${t('tk_periode')} : ${per(r.periode)}, ${esc(jourTxt(r.date))}</div>
    ${r.soumis_at ? `<div class="i">${t('tk_soumis')} : ${quand(r.soumis_at)}</div>` : ''}
    <div class="sep"></div>
    <div class="b">${t('tk_compteurs')}</div>
    ${Object.entries(parProduit).map(([nom, ls]) => `<div class="b">${esc(nom).toUpperCase()}</div>
      ${ls.map(l => `<div class="pompe"><div class="b">${esc(l.pompe_nom)}</div>
        ${L(t('debut'), nf(l.metter_avant,3))}${L(t('fin'), nf(l.metter_apres,3))}
        ${L(`${nf(l.gallons,3)} gal × ${nf(l.prix_gallon,2)}`, G(l.montant))}</div>`).join('')}
      ${L(`<b>${t('total')} ${esc(nom)}</b>`, `<b>${nf(ls.reduce((a,x)=>a+x.gallons,0),3)} gal</b>`)}
      ${L('', `<b>${G(ls.reduce((a,x)=>a+x.montant,0))}</b>`)}`).join('<div class="sep"></div>')}
    <div class="sep2"></div>
    <div class="b">${t('tk_ventes')}</div>
    ${L(t('tk_total_gal'), nf(r.total_gallons,3))}
    ${L(`<b>${t('tk_attendu')}</b>`, `<b>${G(r.montant_attendu)}</b>`)}
    <div class="sep"></div>
    <div class="b">${t('tk_argent')}</div>
    ${billets.map(x => L(`${nf(x.c)} G × ${x.n}`, G(x.c * x.n))).join('')}
    ${r.monnaie ? L(t('monnaie'), G(r.monnaie)) : ''}
    ${L(`<b>${t('tk_compte')}</b>`, `<b>${G(r.montant_compte)}</b>`)}
    <div class="sep2"></div>
    <div class="l gr"><span>${t('tk_ecart')}</span><span>${signe(r.ecart)}</span></div>
    <div class="c">${Math.abs(r.ecart) < 1 ? t('juste') : (r.ecart < 0 ? t('manque') : t('plus'))}</div>
    ${r.note_pompiste ? `<div class="sep"></div><div>${t('tk_note')} : ${esc(r.note_pompiste)}</div>` : ''}
    <div class="sig">${t('tk_sig_pompiste')}</div>
    <div class="sig">${t('tk_sig_resp')}</div>
    <div class="sep"></div>
    <div class="c">${t('tk_verif')}</div>
    <div class="c">${t('tk_imprime')} ${quand(new Date())}</div>
    <div style="height:14mm"></div>`;
}

function imprimerTicket(r){
  const tk = $('ticket');
  tk.className = 'l' + PAPIER;
  tk.innerHTML = ticketHtml(r);
  let st = document.getElementById('format-page');
  if(!st){ st = document.createElement('style'); st.id = 'format-page'; document.head.appendChild(st); }
  st.textContent = `@page{size:${PAPIER}mm auto;margin:2mm 3mm}`;
  clearTimeout(_veille);                 // pas de déconnexion pendant la fenêtre d'impression
  setTimeout(() => window.print(), 50);
}
window.addEventListener('afterprint', () => reveil());

async function reimprimer(id){
  try{
    const rs = await api('GET','/api/pompiste/rapports');
    const r = rs.find(x => x.id === id);
    if(r) imprimerTicket(r);
  }catch(e){}
}

function nouveauRapport(){
  const charte = S.charte; reinit(); S.charte = charte;
  S.etape = 'periode'; chargerContexte();
}

async function chargerHistorique(){
  try{
    const rs = await api('GET','/api/pompiste/rapports');
    $('hist').innerHTML = rs.length ? rs.slice(0,8).map(r=>`<div class="hist">
      <div style="display:flex;justify-content:space-between;gap:8px"><b>${per(r.periode)} · ${esc(jourTxt(r.date))}</b>
        <span class="badge ${r.statut}">${t(r.statut)}</span></div>
      <div style="font-size:15px;color:var(--muted)">${esc([...new Set(r.lignes.map(l=>l.produit_nom))].join(', '))} · ${nf(r.total_gallons,3)} gal · ${t('ecart_court')} ${signe(r.ecart)}</div>
      ${r.commentaire_superviseur ? `<div class="com"><b>${esc(r.traite_par_nom||t('direction'))} :</b> ${esc(r.commentaire_superviseur)}</div>` : ''}
      ${r.statut==='REJETE' ? `<div style="font-size:15px;margin-top:6px;font-weight:700">${t('refaire')}</div>` : ''}
      <button class="btn-mod" style="margin-top:8px" onclick="reimprimer(${r.id})">🖨 ${t('reimprimer')}</button>
    </div>`).join('') : `<span class="sub">${t('aucun_rapport')}</span>`;
  }catch(e){ const h = $('hist'); if(h) h.innerHTML = ''; }
}

// Tablette partagée : déconnexion automatique après 10 min sans toucher
// l'écran (le rapport commencé est gardé et repris à la reconnexion), et
// 2 min après l'écran « Rapport envoyé » (le temps d'imprimer la fiche).
let _veille = null;
function reveil(){
  clearTimeout(_veille);
  if(!S.ctx && S.etape !== 'fin') return;
  _veille = setTimeout(deconnexion, S.etape === 'fin' ? 120_000 : 10 * 60_000);
}
['pointerdown','keydown'].forEach(ev => document.addEventListener(ev, reveil, {passive:true}));

demarrer();
</script>
</body>
</html>
